    function renderQuotaGroups(){const filtered=quotaGroups.filter(q=>{const matchText=[q.name,q.type,q.purpose,q.zone].join(' ').toLowerCase().includes(quotaKeyword.toLowerCase());const matchPurpose=quotaPurpose==='全部'||quotaPurpose==='通算任务用途'&&q.type==='通算配额组'||quotaPurpose==='智算任务用途'&&q.type==='智算配额组'||quotaPurpose==='开发机用途'&&q.purpose==='开发机';const matchScope=quotaScope==='全部'||q.members.includes('admin')||q.manager==='admin';return matchText&&matchPurpose&&matchScope});main.innerHTML=`<h1 class="page-title">配额组管理</h1><p class="page-desc">管理配额组的资源范围、成员及任务使用用途。</p><div class="quota-toolbar"><button class="btn primary" onclick="openCreateQuota()">＋ 创建配额组</button><span class="spacer"></span><div class="segmented"><button class="${quotaScope==='全部'?'active':''}" onclick="setQuotaScope('全部')">全部</button><button class="${quotaScope==='我的'?'active':''}" onclick="setQuotaScope('我的')">仅看我所在的组</button></div><div class="search"><input id="quotaSearch" placeholder="请输入名称搜索" value="${esc(quotaKeyword)}"><span>⌕</span></div><button class="btn" onclick="refreshQuotaGroups()">↻</button></div><div class="quota-tabs">${['全部','通算任务用途','智算任务用途','开发机用途'].map(x=>`<button class="${quotaPurpose===x?'active':''}" onclick="setQuotaPurpose('${x}')">${x}</button>`).join('')}</div><section class="quota-list">${filtered.length?filtered.map(quotaCard).join(''):'<div class="detail-empty">暂无符合筛选条件的配额组</div>'}</section>`;document.getElementById('quotaSearch').addEventListener('input',e=>{quotaKeyword=e.target.value;renderQuotaGroups()})}

    function renderQuotaDetail(){const q=quotaGroups.find(x=>x.id===selectedQuotaId);if(!q){currentModule='quotaGroups';render();return}const tabs=[['basic','基本信息'],['queue','常规任务队列'],['users','用户管理'],['instances','计算实例'],['machines','共享机器'],['cleanup','自动清理策略'],['limits','配额限制']];main.innerHTML=`<div class="detail-head"><button class="detail-back" onclick="switchModule('quotaGroups')">‹</button><h1 class="page-title">${esc(q.name)}配额组详情</h1><div class="actions"><label class="switch-row"><button class="fake-switch ${q.allowIdle?'on':''}" onclick="toggleQuotaDetailIdle(${q.id})"></button>允许闲时任务调度</label><button class="btn" onclick="openQuotaEdit(${q.id})">✎ 编辑</button><button class="btn danger" onclick="askDeleteQuota(${q.id})">⌫ 删除</button></div></div><div class="detail-tabs">${tabs.map(([key,label])=>`<button class="${quotaDetailTab===key?'active':''}" onclick="setQuotaDetailTab('${key}')">${label}</button>`).join('')}</div>${quotaDetailContent(q)}`}

    function openCreateQuota(){modal.innerHTML=`<div class="modal-head"><h2>创建配额组</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body">${quotaForm()}<div class="notice">ⓘ 原型中将以示例资源创建配额组；实际配置项可在后续交互中补充。</div></div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn primary" onclick="saveQuotaCreate()">确定</button></div>`;overlay.classList.add('show');modal.classList.add('show')}

    function saveQuotaCreate(){const input=readQuotaForm();if(!input.name){toast('请输入配额组名称');return}if(quotaGroups.some(q=>q.name===input.name)){toast('配额组名称已存在');return}quotaGroups.unshift({...input,id:Date.now(),privateMachine:input.type!=='通算配额组',allowIdle:false,members:['admin'],manager:'admin',createdAt:'2026/08/21 10:00:00',resources:[['CPU（核）','0 / 64','0'],['内存（Gi）','0 / 256','0'],['本地盘（Gi）','0 / 1,024','0']]});closeLayers();renderQuotaGroups();toast('配额组已创建')}

    function askDeleteQuota(id){const q=quotaGroups.find(x=>x.id===id);modal.innerHTML=`<div class="modal-head"><h2>删除配额组</h2><button class="close" onclick="closeLayers()">×</button></div><div class="confirm-text">确认删除配额组 <b>${esc(q.name)}</b> 吗？删除后将无法继续使用该配额组提交任务。</div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn danger" onclick="confirmDeleteQuota(${id})">删除</button></div>`;overlay.classList.add('show');modal.classList.add('show')}

    function projectSummary(u){if(u.tenantRole==='租户管理员')return '<span class="scope-none">全部项目管理</span>';const admin=u.projectRoles.filter(x=>x.role==='项目管理员').length,operator=u.projectRoles.filter(x=>x.role==='项目操作员').length;return `<div class="scope-summary">${u.tenantRole==='租户观察员'?'<span>全部项目只读</span>':''}${admin?`<span>项目管理员 ${admin}</span>`:''}${operator?`<span>项目操作员 ${operator}</span>`:''}${!admin&&!operator&&u.tenantRole==='无'?'<span>未关联项目</span>':''}</div>`}

    function effectiveProjectRole(u){if(u.tenantRole==='租户管理员')return {role:'租户管理员',source:'租户角色继承'};const item=u.projectRoles.find(x=>x.project===currentProject);if(item)return {role:item.role,source:'项目直接授权'};return u.tenantRole==='租户观察员'?{role:'租户观察员',source:'租户角色继承'}:null}

    function openDetail(id){selectedId=id;detailEditing=false;drawerProjectKeyword='';drawerProjectFilter='全部';renderDrawer();overlay.classList.add('show');drawer.classList.add('show')}
    function renderDrawer(){const u=users.find(x=>x.id===selectedId);if(!u)return;const basic=`<div class="user-card"><div class="user-avatar">${esc(u.name||u.username).slice(0,1)}</div><div><h3>${esc(u.username)}</h3><p>${esc(u.name)}　${esc(u.email)}</p></div></div>`;if(!isTenantView()){const p=effectiveProjectRole(u);drawer.innerHTML=`<div class="drawer-head"><h2>项目用户权限</h2><button class="close" onclick="closeLayers()">×</button></div><div class="drawer-body">${basic}<div class="section-title">当前项目 <span class="hint">仅展示项目范围内权限</span></div><div class="scope-card"><span class="scope-label">${esc(currentProject)}</span><span class="scope-copy"><span class="role-tag ${roleClass(p.role)}">${p.role}</span>　${p.source}</span></div><div class="notice">ⓘ 项目视角不展示和修改用户在其他项目或租户全局的权限。</div></div><div class="drawer-foot"><button class="btn" onclick="closeLayers()">关闭</button></div>`;return}const detail=`${basic}<div class="section-title">租户级权限 <span class="hint">作用于当前租户</span></div><div class="scope-card"><span class="scope-label">${tenantDisplay(u.tenantRole)}</span><span class="scope-copy">${tenantCopy(u.tenantRole)}</span></div>${projectPermissionView(u)}`;drawer.innerHTML=`<div class="drawer-head"><h2>${detailEditing?'编辑用户权限':'用户权限详情'}</h2><button class="close" onclick="closeLayers()">×</button></div><div class="drawer-body">${detailEditing?editForm(u,basic):detail}</div><div class="drawer-foot">${detailEditing?`<button class="btn" onclick="detailEditing=false;renderDrawer()">取消</button><button class="btn primary" onclick="saveDetailEdit()">确定</button>`:`<button class="btn" onclick="closeLayers()">关闭</button>${canManageUsers()?'<button class="btn primary" onclick="detailEditing=true;renderDrawer()">编辑权限</button>':''}`}</div>`}
    function roleOptions(role){return [['无','无租户角色'],['租户观察员','租户观察员'],['租户管理员','租户管理员']].map(([value,label])=>`<button type="button" class="role-option ${role===value?'selected':''}" data-role="${value}" onclick="selectRole('${value}')">${label}</button>`).join('')}
    function projectOptions(selected){return projects.map(p=>`<option value="${esc(p)}" ${p===selected?'selected':''}>${esc(p)}</option>`).join('')}
    function assignmentRow(item={project:projects[0],role:'项目操作员'}){return `<div class="assignment-row"><select data-project>${projectOptions(item.project)}</select><select data-project-role><option value="项目管理员" ${item.role==='项目管理员'?'selected':''}>项目管理员</option><option value="项目操作员" ${item.role==='项目操作员'?'selected':''}>项目操作员</option></select><button type="button" class="icon-btn" title="移除项目权限" onclick="removeAssignmentRow(this)">×</button></div>`}
    function permissionEditor(items){return `<div class="form-row"><label>项目级权限</label><div><div id="assignmentList" class="assignment-list">${items.map(assignmentRow).join('')}</div><button type="button" class="add-assignment" onclick="addAssignmentRow()">＋ 添加项目权限</button><div class="subtext">每个项目仅能配置一种项目角色；租户观察员也可在指定项目获得管理或操作权限。</div></div></div>`}
    function roleNotice(role){if(role==='租户管理员')return 'ⓘ 租户管理员拥有全部项目管理权限，保存后不保留单独的项目角色。';if(role==='租户观察员')return 'ⓘ 租户观察员拥有全部项目只读权限，可选配项目角色；已授权项目以项目角色生效。';return 'ⓘ 未配置租户角色时，至少需要关联一个项目并配置项目角色。'}
    function editForm(u,basic){return `${basic}<div class="section-title">租户级权限 <span class="hint">租户角色可选，观察员可叠加项目角色</span></div><div class="form-row"><label>租户角色</label><div class="role-options">${roleOptions(u.tenantRole)}</div></div><div id="projectPermissionEditor" class="${u.tenantRole==='租户管理员'?'hidden':''}"><div class="section-title">项目级权限</div>${permissionEditor(u.projectRoles)}</div><div id="roleNotice" class="notice">${roleNotice(u.tenantRole)}</div><div class="section-title">账号安全</div><div class="scope-card"><span class="scope-label">登录密码</span><span id="passwordUpdatedAt" class="scope-copy">${u.passwordUpdatedAt?`上次修改：${new Date(u.passwordUpdatedAt).toLocaleString('zh-CN',{hour12:false})}`:'尚未在原型中修改'}</span><button type="button" class="btn small" style="margin-left:auto" onclick="openPasswordModal()">修改密码</button></div><div class="subtext" style="margin-top:8px">密码修改单独保存，不会提交当前未保存的权限配置。</div>`}
    function selectRole(role){document.querySelectorAll('.role-option').forEach(b=>b.classList.toggle('selected',b.dataset.role===role));document.getElementById('projectPermissionEditor')?.classList.toggle('hidden',role==='租户管理员');const note=document.getElementById('roleNotice');if(note)note.textContent=roleNotice(role)}
    function addAssignmentRow(){const list=document.getElementById('assignmentList');const used=[...list.querySelectorAll('[data-project]')].map(x=>x.value);const first=projects.find(x=>!used.includes(x));if(!first){toast('所有项目均已配置权限');return}list.insertAdjacentHTML('beforeend',assignmentRow({project:first,role:'项目操作员'}))}
    function removeAssignmentRow(btn){btn.closest('.assignment-row').remove()}
    function readProjectRoles(){const result=[],seen=new Set();for(const row of document.querySelectorAll('#assignmentList .assignment-row')){const project=row.querySelector('[data-project]').value,role=row.querySelector('[data-project-role]').value;if(seen.has(project))throw new Error(`项目「${project}」重复授权`);seen.add(project);result.push({project,role})}return result}
    function selectedTenantRole(){return document.querySelector('.role-option.selected')?.dataset.role}
    function saveDetailEdit(){const u=users.find(x=>x.id===selectedId),tenantRole=selectedTenantRole();let projectRoles=[];try{if(tenantRole!=='租户管理员'){projectRoles=readProjectRoles();if(tenantRole==='无'&&!projectRoles.length)throw new Error('未配置租户角色时，请至少关联一个项目')}}catch(e){toast(e.message);return}if(tenantRole==='租户管理员'&&u.projectRoles.length&&!window.confirm('设为租户管理员后，将移除该用户已有的项目角色。确认保存吗？'))return;u.tenantRole=tenantRole;u.projectRoles=projectRoles;detailEditing=false;renderDrawer();renderUsers();toast('用户权限已保存')}
    function openPasswordModal(){const u=users.find(x=>x.id===selectedId);if(!u||!canManageUsers()||!isTenantView())return;modal.innerHTML=`<div class="modal-head"><h2>修改 ${esc(u.username)} 的密码</h2><button class="close" onclick="closePasswordModal()" aria-label="关闭">×</button></div><div class="modal-body"><div class="form-row"><label for="newPassword" class="required">新密码</label><input id="newPassword" class="field" type="password" autocomplete="new-password" placeholder="至少 8 位字符"></div><div class="form-row"><label for="confirmPassword" class="required">确认新密码</label><input id="confirmPassword" class="field" type="password" autocomplete="new-password" placeholder="再次输入新密码"></div><div class="notice">ⓘ 仅演示修改流程；原型不会保存或发送输入的密码。</div></div><div class="modal-foot"><button class="btn" onclick="closePasswordModal()">取消</button><button class="btn primary" onclick="savePasswordChange()">确认修改</button></div>`;modal.dataset.kind='password';modal.classList.add('show');document.getElementById('newPassword').focus()}
    function closePasswordModal(){modal.classList.remove('show');delete modal.dataset.kind;modal.innerHTML=''}
    function savePasswordChange(){const password=document.getElementById('newPassword').value,confirm=document.getElementById('confirmPassword').value;if(password.length<8){toast('新密码至少需要 8 位字符');return}if(password!==confirm){toast('两次输入的密码不一致');return}const u=users.find(x=>x.id===selectedId);if(!u)return;u.passwordUpdatedAt=Date.now();closePasswordModal();const updated=document.getElementById('passwordUpdatedAt');if(updated)updated.textContent=`上次修改：${new Date(u.passwordUpdatedAt).toLocaleString('zh-CN',{hour12:false})}`;toast('密码修改已在原型中演示完成')}
    function openEdit(id){openDetail(id);detailEditing=true;renderDrawer()}
    function openAdd(){modal.innerHTML=`<div class="modal-head"><h2>添加用户</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body"><div class="form-row"><label class="required">用户名</label><input id="addUsername" class="field" placeholder="请输入用户名"></div><div class="form-row"><label class="required">姓名</label><input id="addName" class="field" placeholder="请输入姓名"></div><div class="form-row"><label>电子邮件</label><input id="addEmail" class="field" placeholder="请输入电子邮件"></div><div class="form-row"><label for="addPassword" class="required">密码</label><input id="addPassword" class="field" type="password" autocomplete="new-password" placeholder="请输入密码"></div><div class="section-title">权限配置</div><div class="form-row"><label>租户角色</label><div class="role-options">${roleOptions('无')}</div></div><div id="projectPermissionEditor"><div class="section-title">项目级权限</div>${permissionEditor([])}</div><div id="roleNotice" class="notice">${roleNotice('无')}</div></div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn primary" onclick="saveAdd()">确定</button></div>`;overlay.classList.add('show');modal.classList.add('show')}
    function saveAdd(){const username=document.getElementById('addUsername').value.trim(),name=document.getElementById('addName').value.trim(),email=document.getElementById('addEmail').value.trim(),password=document.getElementById('addPassword').value,tenantRole=selectedTenantRole();if(!username||!name){toast('请填写用户名和姓名');return}if(!password){toast('请输入密码');return}if(users.some(u=>u.username===username)){toast('用户名已存在');return}let projectRoles=[];try{if(tenantRole!=='租户管理员'){projectRoles=readProjectRoles();if(tenantRole==='无'&&!projectRoles.length)throw new Error('未配置租户角色时，请至少关联一个项目')}}catch(e){toast(e.message);return}users.unshift({id:Date.now(),username,name,email,tenantRole,projectRoles});closeLayers();page=1;renderUsers();toast('用户已添加')}
    function askDelete(id){const u=users.find(x=>x.id===id);modal.innerHTML=`<div class="modal-head"><h2>删除用户</h2><button class="close" onclick="closeLayers()">×</button></div><div class="confirm-text">确认删除用户 <b>${esc(u.username)}</b> 吗？删除后该用户将失去当前租户下的全部权限。</div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn danger" onclick="confirmDelete(${id})">删除</button></div>`;overlay.classList.add('show');modal.classList.add('show')}
    function confirmDelete(id){users=users.filter(u=>u.id!==id);closeLayers();renderUsers();toast('用户已删除')}
    function closeLayers(){overlay.classList.remove('show');drawer.classList.remove('show');modal.classList.remove('show');delete modal.dataset.kind;detailEditing=false}
    function setProjectFilter(value){drawerProjectFilter=value;renderDrawer()}
    function setDrawerProjectSearch(value){drawerProjectKeyword=value;renderDrawer()}
    function changePage(n){page=n;renderUsers()}
    function refreshUsers(){toast('用户列表已刷新')}
    function quotaMachineSet(q){return q.privateMachine?machines.slice(0,3):machines.slice(3)}
    function aggregateScopedMachineResource(rows,key){return rows.reduce((acc,m)=>{const r=machineResource(m,key);Object.keys(acc).forEach(k=>acc[k]+=r[k]);return acc},{system:0,used:0,releasing:0,locked:0,usable:0,total:0})}
    function scopedMachineSummaryCard(rows,key){const r=aggregateScopedMachineResource(rows,key),[label,unit]=resourceMeta[key];return `<article class="machine-stat"><div class="machine-stat-main"><h3>${label}<span>（${unit}）</span></h3><div class="machine-total">总量 <b>${number(r.total)}</b></div><div class="machine-legend"><span><i></i>系统 <b>${number(r.system)}</b></span><span class="used"><i></i>已使用 <b>${number(r.used)}</b></span><span class="releasing"><i></i>释放中 <b>${number(r.releasing)}</b></span><span class="locked"><i></i>锁定 <b>${number(r.locked)}</b></span><span class="usable"><i></i>可使用 <b>${number(r.usable)}</b></span></div></div><div class="donut" style="${donutStyle(r)}"></div></article>`}
    function quotaMachinesContent(q){const rows=quotaMachineSet(q),title=q.privateMachine?'私有机器':'共享机器';return `<section class="detail-panel"><div class="heading"><div><h2 style="margin-bottom:6px">${title}</h2><p class="page-desc" style="margin:0">资源统计采用“系统 / 已使用 / 释放中 / 锁定 / 可使用 / 总量”口径。</p></div><button class="link-btn" onclick="toast('已打开 GPU 占用者查看入口')">查看 GPU 占用者</button></div><div class="machine-notice"><span>ⓘ</span><div><b>锁定规则：</b>关闭机器“可调度”后，机器的未使用 CPU、内存、GPU 与本地盘资源会从“可使用”转入“锁定”；已运行和释放中的资源保持原状态，解锁后锁定资源回流。</div></div><div class="machine-summary">${['cpu','gpu','memory','disk'].map(key=>scopedMachineSummaryCard(rows,key)).join('')}</div><div class="table-wrap"><table class="data-table machine-table"><thead><tr><th>名称/ID</th><th>可用区</th><th>组织</th><th>机器状态</th><th>维护状态</th><th>GPU（卡）</th><th>CPU（核）</th><th>内存（Gi）</th><th>本地盘（Gi）</th><th>卡类型</th><th>Pod 个数</th><th>可调度</th></tr></thead><tbody>${rows.map(m=>`<tr><td class="machine-name"><b>${esc(m.name)}</b><span class="subtext">M-${String(m.id).padStart(5,'0')}</span></td><td>${m.zone}</td><td><div class="machine-org">${esc(m.org)}</div></td><td><span class="state-tag state-run">${m.status}</span></td><td><span class="state-tag ${m.schedulable?'state-run':'state-lock'}">${m.schedulable?m.maintain:'锁定'}</span></td><td>${resourceText(m,'gpu')}</td><td>${resourceText(m,'cpu')}</td><td>${resourceText(m,'memory')}</td><td>${resourceText(m,'disk')}</td><td>${m.cardType}</td><td style="text-align:center">${m.pods}</td><td><div class="sched-cell"><button class="fake-switch ${m.schedulable?'on':''}" onclick="toggleMachineSchedule(${m.id})" aria-label="切换机器可调度状态"></button><span class="sched-label ${m.schedulable?'':'off'}">${m.schedulable?'可调度':'已锁定'}</span></div></td></tr>`).join('')}</tbody></table></div><div class="machine-footnote">锁定机器不接收新任务、扩容或新增 Worker；已运行任务可继续执行。锁定后的空闲资源不计入配额组的可使用资源。</div></section>`}
    function quotaDetailContent(q){if(quotaDetailTab==='basic')return `<section class="detail-panel"><h2>基本信息</h2><div class="detail-info"><div><span>名称</span><b>${esc(q.name)}</b></div><div><span>创建者</span><b>${esc(q.manager)}</b></div><div><span>创建时间</span><b>${q.createdAt}</b></div><div><span>类型</span><b>${q.type}</b></div><div><span>用途</span><b>${q.purpose}</b></div><div><span>使用私有机器</span><b>${q.privateMachine?'是':'否'}</b></div><div><span>可用区</span><b>${q.zone}</b></div></div></section><section class="detail-panel"><h2>资源信息</h2><div class="quota-resource-grid">${resourceBlocks(q.resources)}</div></section><section class="detail-panel"><h2>人员信息</h2><div class="detail-info"><div><span>配额组人数</span><b>${q.members.length} 人</b></div><div><span>管理员</span><b>${esc(q.manager)}</b></div></div></section>`;if(quotaDetailTab==='users')return `<section class="detail-panel"><h2>用户管理</h2><table class="member-table"><thead><tr><th>用户名</th><th>配额组角色</th><th>授权状态</th></tr></thead><tbody>${q.members.map((m,i)=>`<tr><td>${esc(m)}</td><td><span class="role-tag ${i===0?'role-admin':'role-operator'}">${m===q.manager?'配额组管理员':'配额组操作员'}</span></td><td>已授权</td></tr>`).join('')}</tbody></table></section>`;if(quotaDetailTab==='limits')return `<section class="detail-panel"><h2>配额限制</h2><table class="member-table"><thead><tr><th>资源类型</th><th>已使用</th><th>可用</th><th>总资源</th></tr></thead><tbody>${q.resources.map(([n,v])=>{const [used,total]=v.split(' / ');return `<tr><td>${n}</td><td>${used}</td><td>--</td><td>${total}</td></tr>`}).join('')}</tbody></table></section>`;if(quotaDetailTab==='cleanup')return `<section class="detail-panel"><h2>自动清理策略</h2><div class="scope-card"><div><b>自动清理策略已有独立交互原型</b><div class="scope-copy" style="margin:6px 0 0">可在完整原型中查看策略列表、策略详情、启停、事件审计与实例详情跳转。</div></div><button class="btn primary" style="margin-left:auto" onclick="openCleanupPrototype(${q.id})">打开策略原型 ↗</button></div></section>`;if(quotaDetailTab==='machines')return quotaMachinesContent(q);const names={queue:'常规任务队列',instances:'计算实例'};return `<section class="detail-panel"><h2>${names[quotaDetailTab]}</h2><div class="detail-empty">${names[quotaDetailTab]}模块将在配额组详情中持续完善。</div></section>`}
    function renderQuotaDetail(){const q=quotaGroups.find(x=>x.id===selectedQuotaId);if(!q){currentModule='quotaGroups';render();return}const machineLabel=q.privateMachine?'私有机器':'共享机器';const tabs=[['basic','基本信息'],['queue','常规任务队列'],['users','用户管理'],['instances','计算实例'],['machines',machineLabel],['cleanup','自动清理策略'],['limits','配额限制']];main.innerHTML=`<div class="detail-head"><button class="detail-back" onclick="switchModule('quotaGroups')">‹</button><h1 class="page-title">${esc(q.name)}配额组详情</h1><div class="actions"><label class="switch-row"><button class="fake-switch ${q.allowIdle?'on':''}" onclick="toggleQuotaDetailIdle(${q.id})"></button>允许闲时任务调度</label><button class="btn" onclick="openQuotaEdit(${q.id})">✎ 编辑</button><button class="btn danger" onclick="askDeleteQuota(${q.id})">⌫ 删除</button></div></div><div class="detail-tabs">${tabs.map(([key,label])=>`<button class="${quotaDetailTab===key?'active':''}" onclick="setQuotaDetailTab('${key}')">${label}</button>`).join('')}</div>${quotaDetailContent(q)}`}
    function toggleMachineSchedule(id){const m=machines.find(x=>x.id===id);m.schedulable=!m.schedulable;if(currentModule==='quotaGroupDetail'&&quotaDetailTab==='machines')renderQuotaDetail();else renderMachines();toast(m.schedulable?`已解锁 ${m.name}，锁定资源已回流至可使用资源`:`已锁定 ${m.name}，未使用资源已调整为锁定资源`)}
    function switchModule(key){currentModule=key;render()}
    scopeNav.addEventListener('click',e=>{const moduleButton=e.target.closest('[data-module]');if(moduleButton){switchModule(moduleButton.dataset.module);return}const groupButton=e.target.closest('[data-group]');if(groupButton){const el=scopeNav.querySelector(`[data-group-content="${groupButton.dataset.group}"]`);el.classList.toggle('hidden');groupButton.querySelector('.chev').textContent=el.classList.contains('hidden')?'⌄':'⌃'}});
    roleSelect.addEventListener('change',e=>changeRole(e.target.value));
    document.getElementById('toggleSide').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('collapsed'));
    overlay.addEventListener('click',()=>modal.dataset.kind==='password'?closePasswordModal():closeLayers());document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal.dataset.kind==='password')closePasswordModal();else closeLayers()}});
    renderSidebar();render();
  </script>
</body>
</html>
