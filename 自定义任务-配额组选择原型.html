  <style>
    :root{--blue:#2f6bff;--text:#1e2a3c;--muted:#7b899c;--line:#e5eaf2;--page:#f5f7fb;--green:#1fa96b;--orange:#e98300;--purple:#7655cf}*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--page);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:56px;display:flex;align-items:center;gap:28px;padding:0 18px;border-bottom:1px solid var(--line);background:#fff}.brand{font-size:18px;font-weight:700}.brand i{color:var(--blue);font-style:normal}.nav{display:flex;gap:29px;color:#46566d}.nav b{color:var(--blue)}.top-right{margin-left:auto;color:#5d6b7f}.layout{display:flex;min-height:calc(100vh - 56px)}.side{width:168px;flex:none;padding:12px 8px;border-right:1px solid var(--line);background:#f7f9fd}.tenant{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;margin-bottom:12px;border:1px solid var(--line);border-radius:5px;background:#fff}.side-group{margin:10px 0;color:#7b899d;font-size:12px}.side a{display:block;padding:8px 15px;margin:1px 0;border-radius:4px;color:#617087;text-decoration:none}.side a.active{color:var(--blue);background:#e8f1ff;font-weight:600}.side .indent{padding-left:29px}.main{min-width:0;flex:1;padding:20px 28px 34px}.page-head{display:flex;align-items:center;gap:12px;margin-bottom:17px}.page-head h1{margin:0;font-size:21px}.page-head p{margin:0;color:#8591a1;font-size:12px}.btn{height:34px;padding:0 13px;border:1px solid #d8e1ef;border-radius:5px;color:#526276;background:#fff}.btn.primary{color:#fff;border-color:var(--blue);background:var(--blue)}.btn.danger{color:#ef5a53;border-color:#f1b8b5}.btn.small{height:29px;padding:0 10px;font-size:12px}.toolbar{display:flex;align-items:center;gap:10px;margin:14px 0}.toolbar .spacer{margin-left:auto}.search{display:flex;align-items:center;width:230px;height:34px;padding:0 10px;border:1px solid #dfe5ee;border-radius:5px;background:#fff}.search input{min-width:0;flex:1;border:0;outline:0}.filter{height:34px;padding:0 9px;border:1px solid #dfe5ee;border-radius:5px;color:#55657a;background:#fff}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}.tabs button{height:38px;border:0;border-bottom:2px solid transparent;color:#58677c;background:transparent}.tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:600}.card{border:1px solid var(--line);border-radius:7px;background:#fff}.table-wrap{overflow:auto}.data{width:100%;min-width:1280px;border-collapse:collapse;background:#fff}.data th,.data td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.data th{color:#405068;background:#f5f7fa;font-size:12px}.data td{font-size:12px}.data tr:last-child td{border-bottom:0}.task-name{border:0;padding:0;color:var(--blue);background:transparent;font-weight:600}.sub{display:block;margin-top:3px;color:#8b98aa;font-size:11px}.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:3px;font-size:11px}.badge.closed{color:#596a80;background:#eef1f5}.badge.run{color:#15875a;background:#e6f8ed}.badge.fail{color:#df5c54;background:#ffeded}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 0;color:#647389}.page-btn{width:28px;height:28px;border:0;border-radius:4px;color:#53637a;background:#fff}.page-btn.active{color:var(--blue);background:#eaf2ff}.empty{padding:34px;color:#8793a3;text-align:center}.create-shell{display:grid;grid-template-columns:170px minmax(580px,780px) 250px;gap:24px;align-items:start}.step-nav{position:sticky;top:12px;padding:10px 0}.step-nav button{display:block;width:100%;padding:9px 11px;border:0;border-radius:4px;color:#657389;background:transparent;text-align:left}.step-nav button.active{color:var(--blue);background:#eaf2ff;font-weight:600}.form-panel{padding:24px 30px}.form-section{padding:0 0 28px;margin-bottom:26px;border-bottom:1px solid var(--line)}.form-section:last-child{border-bottom:0}.form-section h2{margin:0 0 19px;font-size:16px}.form-row{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:flex-start;margin:14px 0}.form-row label{padding-top:7px;color:#57677d}.required:before{margin-right:4px;color:#ef5a53;content:'*'}.field{width:100%;height:34px;padding:0 10px;border:1px solid #dce3ed;border-radius:5px;outline:0}.field:focus{border-color:var(--blue)}.zone{display:flex;gap:7px}.chip-btn{height:32px;padding:0 12px;border:1px solid #dce3ed;border-radius:4px;color:#57677d;background:#fff}.chip-btn.active{color:var(--blue);border-color:#bed0ff;background:#f2f6ff}.command{height:98px;padding:10px;border:1px solid #dce3ed;border-radius:5px;color:#8a98aa;background:#f8fafc}.resource-source{display:flex;gap:5px}.quota-selector{display:flex;align-items:center;justify-content:space-between;min-height:42px;padding:5px 7px 5px 10px;border:1px solid #bfd1ff;border-radius:5px;background:#f8fbff}.quota-selector b{color:#2d4265}.quota-meta{margin-top:8px;color:#708097;font-size:12px}.mini-resource{display:flex;gap:7px;margin-top:8px}.mini-resource span{padding:2px 6px;border-radius:3px;color:#657389;background:#f2f5f8;font-size:11px}.cost{position:sticky;top:12px;padding:18px}.cost h3{margin:0 0 12px;font-size:15px}.cost-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);color:#657389}.cost-row b{color:#1f2c3e}.footer-actions{position:fixed;right:0;bottom:0;left:0;display:flex;justify-content:flex-end;gap:10px;padding:12px 28px;border-top:1px solid var(--line);background:#fff}.create-page .main{padding-bottom:78px}.overlay{position:fixed;z-index:10;inset:0;background:rgba(25,36,54,.47);opacity:0;visibility:hidden;transition:.15s}.overlay.show{opacity:1;visibility:visible}.drawer{position:fixed;z-index:11;top:0;right:0;bottom:0;width:min(980px,78vw);display:flex;flex-direction:column;background:#fff;box-shadow:-6px 0 20px rgba(16,35,66,.16);transform:translateX(100%);transition:.2s}.drawer.show{transform:translateX(0)}.drawer-head{display:flex;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0;font-size:18px}.close{margin-left:auto;border:0;color:#66758b;background:transparent;font-size:24px}.drawer-tabs{display:flex;gap:24px;padding:0 20px;border-bottom:1px solid var(--line)}.drawer-tabs button{height:42px;border:0;border-bottom:2px solid transparent;color:#66758a;background:transparent}.drawer-tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:600}.drawer-tools{display:flex;align-items:center;gap:10px;padding:14px 20px}.drawer-tools .search{margin-left:auto}.drawer-body{min-height:0;flex:1;overflow:auto;padding:0 20px}.quota-table{min-width:900px}.quota-table th,.quota-table td{vertical-align:middle}.quota-name{color:#245ddc;font-weight:600}.resource-state{min-width:150px;line-height:1.4}.resource-state .total{color:#708097;font-size:11px}.resource-state .top{display:flex;gap:4px;height:auto;padding:3px 0;border:0;background:transparent}.resource-state em{padding:2px 5px;border-radius:3px;font-style:normal;font-size:10px}.used{color:#c36a00;background:#fff0d8}.usable{color:#19784e;background:#e6f8ee}.locked{color:#6c4bc6;background:#f0ebff}.resource-state small{color:#97a2b1;font-size:10px}.pool-tag{display:inline-block;padding:3px 6px;border-radius:3px;color:#5e6f85;background:#eef2f7;font-size:11px}.pool-tag.private{color:#5d54a8;background:#f0eeff}.drawer-foot{display:flex;justify-content:flex-end;gap:10px;padding:13px 20px;border-top:1px solid var(--line)}.notice{padding:10px 12px;border:1px solid #cfe0ff;border-radius:5px;color:#597191;background:#f4f8ff;font-size:12px}.toast{position:fixed;z-index:20;bottom:70px;left:50%;padding:9px 16px;border-radius:5px;color:#fff;background:#263a58;opacity:0;transform:translate(-50%,10px);transition:.16s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1150px){.create-shell{grid-template-columns:130px minmax(520px,1fr)}.cost{display:none}.drawer{width:92vw}}@media(max-width:760px){.side{display:none}.main{padding:16px}.create-shell{grid-template-columns:1fr}.step-nav{display:flex;gap:5px;position:static}.step-nav button{width:auto}.form-row{grid-template-columns:1fr}.form-row label{padding-top:0}.drawer{width:100vw}.top{gap:12px}.nav{display:none}}
    .quota-table tr.disabled{background:#fafbfc}.quota-table tr.disabled td{color:#96a1b1}.quota-table tr.disabled .quota-name{color:#8491a3}

<body>
  <header class="top"><span>☰</span><div class="brand"><i>◢</i> 仪电智算云</div><nav class="nav"><span>概览</span><b>模型服务中心</b><span>应用中心</span><span>资产中心</span><span>管理中心</span></nav><div class="top-right">⌖ 上海　⌄　 ♧ 工单　▣ 文档　●</div></header>
  <div id="app"></div><div id="overlay" class="overlay" onclick="closeQuotaDrawer()"></div><aside id="drawer" class="drawer"></aside><div id="toast" class="toast"></div>
  <script>
    const tasks=[
      {name:'hjqtest082601-copy',id:'j-1787731280-115724',pool:'rayjobowner',status:'已关闭',time:'2026-08-26 16:01:20',res:'1核 / 1卡 / 8Gi'},
      {name:'hjqtest082601',id:'j-1787731172-24140',pool:'rayjobowner',status:'已关闭',time:'2026-08-26 15:59:32',res:'1核 / 1卡 / 8Gi'},
      {name:'gpu-evaluation',id:'j-1787728806-404836',pool:'lusy_gpu_share',status:'运行中',time:'2026-08-26 15:20:06',res:'8核 / 2卡 / 32Gi'},
      {name:'ray-finetune-demo',id:'j-1787728828-485757',pool:'myytest',status:'失败',time:'2026-08-26 14:42:16',res:'16核 / 4卡 / 64Gi'}
    ];
    const requestedTaskResources={gpu:1,cpu:8,mem:32};
    const quotas=[
      {id:1,name:'myytest',kind:'私有机器',zone:'可用区B',gpu:[12,4,8,24,0,0],cpu:[145,20,35,200,0,0],mem:[384,64,64,512,0,0],note:'独享机器资源；不可用资源已从本配额组可使用资源中扣除。'},
      {id:2,name:'lusy_gpu_share',kind:'共享机器',zone:'可用区B、可用区C',gpu:[9,7,0,16,0,0],cpu:[63,18,47,128,0,0],mem:[1354,162,532,2048,0,0],note:'共享资源池额度；配额尚有剩余，但 GPU 受共享池实时供给限制，当前不可用。'},
      {id:3,name:'rayjobowner',kind:'私有机器',zone:'可用区B',gpu:[23,3,6,32,0,0],cpu:[258,31,607,896,0,2],mem:[2734,420,2891,6045,0,0],note:'独享机器资源；存在 3 卡 GPU 不可用，恢复可调度后将回流至可使用资源。'},
      {id:4,name:'bss_gpu',kind:'共享机器',zone:'可用区B',gpu:[1,0,17,20,0,0],cpu:[1,0,19,20,0,0],mem:[8,0,1016,1024,0,0],note:'共享资源池额度；当前资源供给充足，可继续申请。'}
    ];
    let view='list',selectedQuota=quotas[0],drawerTab='智算任务配额组',quotaKeyword='';
    const app=document.getElementById('app'),drawer=document.getElementById('drawer'),overlay=document.getElementById('overlay');
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(window.t);window.t=setTimeout(()=>e.classList.remove('show'),1800)}
    function shell(content,create=false){return `<div class="layout ${create?'create-page':''}"><aside class="side"><div class="tenant">x86test-infra <span>⌄</span></div><div class="side-group">◇ 模型训练　⌃</div><a class="indent">开发机</a><a class="indent active">自定义任务</a><a class="indent">Ray任务</a><a class="indent">模型微调</a><div class="side-group">◇ 模型推理　⌃</div><a class="indent">模型部署</a><a class="indent">API KEY</a><a class="indent">模型评测</a><a class="indent">模型体验</a><a class="indent">Token统计</a></aside><main class="main">${content}</main></div>`}
    function statusBadge(s){return `<span class="badge ${s==='运行中'?'run':s==='失败'?'fail':'closed'}">● ${s}</span>`}
    function renderList(){app.innerHTML=shell(`<div class="page-head"><h1>自定义任务</h1><p>自定义任务是平台的 Job 提交机制，由多个 task 组成，每个 task 可指定镜像、支持建立多个 replica。</p><button class="btn small" style="margin-left:auto" onclick="toast('已进入管理配置入口')">⚙ 管理配置</button></div><div class="tabs"><button class="active">常规任务</button></div><div class="toolbar"><button class="btn primary" onclick="openCreate()">＋ 创建自定义任务</button><button class="btn" disabled>◷ 批量关闭</button><span class="spacer"></span><button class="btn small">我创建的</button><select class="filter"><option>全部</option></select><select class="filter"><option>可用区B</option></select><select class="filter"><option>自定义任务名称</option></select><div class="search"><input id="taskSearch" placeholder="请输入名称搜索"><span>⌕</span></div><button class="btn" onclick="toast('任务列表已刷新')">↻</button></div><section class="card table-wrap"><table class="data"><thead><tr><th><input type="checkbox"></th><th>自定义任务名称/ID</th><th>可用区</th><th>训练检测状态</th><th>状态</th><th>资源来源</th><th>优先级</th><th>子任务数</th><th>副本总数</th><th>总资源配置</th><th>创建者</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${tasks.map(t=>`<tr><td><input type="checkbox"></td><td><button class="task-name" onclick="toast('已打开任务详情：${esc(t.name)}')">${esc(t.name)}</button><span class="sub">${t.id}</span></td><td>可用区B</td><td>未启用</td><td>${statusBadge(t.status)}</td><td>${esc(t.pool)}</td><td>5</td><td>1</td><td>0 / 0 / 0 / 0<span class="sub">启动中/运行中/成功/失败</span></td><td>${t.res}<span class="sub">CPU/GPU/内存</span></td><td>admin</td><td>${t.time}</td><td><button class="task-name" onclick="copyTask('${esc(t.name)}')">复制</button>　<button class="task-name" style="color:#ef5a53" onclick="toast('删除操作仅作原型演示')">删除</button></td></tr>`).join('')}</tbody></table></section><div class="pagination"><span>共 ${tasks.length} 条</span><button class="page-btn active">1</button><button class="btn small">20 条/页⌄</button></div>`);document.getElementById('taskSearch').addEventListener('input',e=>{const v=e.target.value.toLowerCase();document.querySelectorAll('.data tbody tr').forEach((tr,i)=>tr.style.display=tasks[i].name.toLowerCase().includes(v)?'':'none')})}
    function quotaSummary(q){const shared=q.kind==='共享机器',used=shared?'已分配':'已使用';return `<div class="quota-selector"><div><b>${esc(q.name)}</b><span class="pool-tag ${q.kind==='私有机器'?'private':''}" style="margin-left:7px">${q.kind}</span><div class="quota-meta">${q.zone}　·　${q.note}</div><div class="mini-resource"><span>GPU：${used} ${q.gpu[0]} / 不可用 ${q.gpu[1]} / 可使用 ${q.gpu[2]}</span><span>CPU：${used} ${q.cpu[0]} / 不可用 ${q.cpu[1]} / 可使用 ${q.cpu[2]}</span></div></div><button class="btn small" onclick="openQuotaDrawer()">更换配额组</button></div>`}
    function renderCreate(){app.innerHTML=shell(`<div class="page-head"><button class="btn small" onclick="view='list';render()">‹ 返回</button><h1>创建自定义任务</h1></div><div class="create-shell"><aside class="step-nav"><button class="active">基础配置</button><button>环境配置</button><button>任务配置</button></aside><section class="card form-panel"><section class="form-section"><h2>基础配置</h2><div class="form-row"><label class="required">自定义任务名称</label><input id="taskName" class="field" placeholder="请输入自定义任务名称" value="gpu-train-demo"></div><div class="form-row"><label class="required">可用区</label><div class="zone"><button class="chip-btn active">可用区B</button><button class="chip-btn">可用区C</button></div></div></section><section class="form-section"><h2>环境配置</h2><div class="form-row"><label class="required">镜像</label><div><div class="resource-source"><button class="chip-btn active">平台镜像</button><button class="chip-btn">自定义镜像</button></div><input class="field" style="margin-top:8px" value="pytorch-2.3-cuda12.1:latest"></div></div><div class="form-row"><label class="required">运行命令</label><div class="command">1　python train.py --epochs 20 --batch-size 32</div></div><div class="form-row"><label>环境变量</label><button class="task-name">＋ 添加环境变量（0/20）</button></div><div class="form-row"><label>挂载存储</label><button class="task-name">＋ 添加 GPFS（0/10）</button></div></section><section class="form-section"><h2>任务配置</h2><div class="form-row"><label>资源来源</label><div class="resource-source"><button id="publicSource" class="chip-btn" onclick="setSource('public')">公共资源池</button><button id="quotaSource" class="chip-btn active" onclick="setSource('quota')">配额组</button></div></div><div id="quotaField" class="form-row"><label class="required">配额组</label><div>${quotaSummary(selectedQuota)}</div></div><div class="form-row"><label class="required">优先级</label><div class="zone">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="chip-btn ${n===5?'active':''}">${n}</button>`).join('')}</div></div><div class="form-row"><label>QoS 服务质量</label><div class="zone"><button class="chip-btn active">Guaranteed</button><button class="chip-btn">BestEffort</button></div></div><div class="form-row"><label>子任务配置</label><div style="padding:10px;border:1px solid #e3e8f0;border-radius:5px;background:#fafbfc"><input class="field" style="width:110px" value="task1">　副本数 <input class="field" style="width:60px" value="1">　CPU/核 <input class="field" style="width:60px" value="8">　GPU/卡 <input class="field" style="width:60px" value="1">　内存/Gi <input class="field" style="width:65px" value="32"></div></div></section></section><aside class="card cost"><h3>费用详情</h3><p class="sub">按选择资源实时估算费用</p><div class="cost-row"><span>实例</span><b>Task 1 × 1</b></div><div class="cost-row"><span>资源规格</span><b>8 核 / 1 卡 / 32 Gi</b></div><div class="cost-row"><span>资源来源</span><b id="costPool">${esc(selectedQuota.name)}</b></div><div class="cost-row"><span>总费用</span><b style="color:#f07819">¥ 0.00 / 小时</b></div></aside></div><div class="footer-actions"><button class="btn" onclick="view='list';render()">取消</button><button class="btn primary" onclick="submitTask()">创建</button></div>`,true)}
    function render(){view==='list'?renderList():renderCreate()}
    function openCreate(){view='create';render()}
    function setSource(type){const quota=type==='quota';document.getElementById('quotaSource').classList.toggle('active',quota);document.getElementById('publicSource').classList.toggle('active',!quota);document.getElementById('quotaField').style.display=quota?'grid':'none';document.getElementById('costPool').textContent=quota?selectedQuota.name:'公共资源池';toast(quota?'已切换为配额组资源':'已切换为公共资源池')}
    function resourceState(arr,kind){const [used,blocked,usable,total,system,releasing]=arr,shared=kind==='共享机器';const totalLabel=shared?'总配额':'总量',usedLabel=shared?'已分配':'已使用';const detail=shared?`配额剩余 ${blocked+usable} · 受共享池实时供给影响`:`系统 ${system} · 释放中 ${releasing}`;return `<div class="resource-state"><div class="total">${totalLabel} <b>${total}</b></div><div class="top"><em class="used">${usedLabel} ${used}</em>${blocked?`<em class="locked">不可用 ${blocked}</em>`:''}<em class="usable">可使用 ${usable}</em></div><small>${detail}</small></div>`}
    function quotaAvailability(q){const lacks=[['GPU',q.gpu[2],requestedTaskResources.gpu,'卡'],['CPU',q.cpu[2],requestedTaskResources.cpu,'核'],['内存',q.mem[2],requestedTaskResources.mem,'Gi']].filter(([,available,requested])=>available<requested);return lacks.length?{selectable:false,reason:lacks.map(([name,available,requested,unit])=>`${name} 可使用 ${available}${unit}，本任务需 ${requested}${unit}`).join('；')}:{selectable:true,reason:'可满足本次任务资源申请'}}
    function openQuotaDrawer(){drawer.classList.add('show');overlay.classList.add('show');renderDrawer()}
    function closeQuotaDrawer(){drawer.classList.remove('show');overlay.classList.remove('show')}
    function renderDrawer(){const rows=quotas.filter(q=>q.name.toLowerCase().includes(quotaKeyword.toLowerCase()));drawer.innerHTML=`<div class="drawer-head"><h2>选择配额组</h2><button class="close" onclick="closeQuotaDrawer()">×</button></div><div class="drawer-tabs"><button class="active" onclick="drawerTab='智算任务配额组';renderDrawer()">智算任务配额组</button><button onclick="drawerTab='通算任务配额组';renderDrawer()">通算任务配额组</button></div><div class="drawer-tools"><div class="notice">ⓘ 配额组资源中的“不可用”表示当前不能用于新任务申请：私有机器由机器不可调度导致，共享机器则可能受共享池实时供给限制。当前任务不满足资源申请时，配额组显示为“不可用”。</div><div class="search"><input id="quotaDrawerSearch" placeholder="请输入名称搜索" value="${esc(quotaKeyword)}"><span>⌕</span></div></div><div class="drawer-body"><div class="table-wrap"><table class="data quota-table"><thead><tr><th></th><th>配额组名称</th><th>资源来源</th><th>可用区</th><th>GPU（卡）</th><th>CPU（核）</th><th>内存（Gi）</th><th>任务可用性</th></tr></thead><tbody>${rows.map(q=>{const availability=quotaAvailability(q);return `<tr class="${availability.selectable?'':'disabled'}"><td><input type="radio" name="quota" value="${q.id}" ${selectedQuota.id===q.id?'checked':''} ${availability.selectable?'':'disabled'} onchange="selectQuota(${q.id})"></td><td><span class="quota-name">${esc(q.name)}</span></td><td><span class="pool-tag ${q.kind==='私有机器'?'private':''}">${q.kind}</span></td><td>${q.zone}</td><td>${resourceState(q.gpu,q.kind)}</td><td>${resourceState(q.cpu,q.kind)}</td><td>${resourceState(q.mem,q.kind)}</td><td style="white-space:normal;min-width:205px;color:${availability.selectable?'#19784e':'#d74d45'}"><b>${availability.selectable?'可用':'不可用'}</b><br>${availability.reason}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">未找到匹配的配额组</td></tr>'}</tbody></table></div></div><div class="drawer-foot"><button class="btn" onclick="closeQuotaDrawer()">取消</button><button class="btn primary" onclick="confirmQuota()">确定</button></div>`;document.getElementById('quotaDrawerSearch').addEventListener('input',e=>{quotaKeyword=e.target.value;renderDrawer()})}
    function selectQuota(id){const quota=quotas.find(q=>q.id===id),availability=quotaAvailability(quota);if(!availability.selectable){toast(`该配额组不可用：${availability.reason}`);return}selectedQuota=quota}
    function confirmQuota(){closeQuotaDrawer();renderCreate();toast(`已选择配额组：${selectedQuota.name}`)}
    function submitTask(){const n=document.getElementById('taskName').value.trim();if(!n){toast('请输入自定义任务名称');return}tasks.unshift({name:n,id:`j-${Date.now()}`,pool:selectedQuota.name,status:'运行中',time:'2026-08-26 17:30:00',res:'8核 / 1卡 / 32Gi'});view='list';render();toast('自定义任务已创建')}
    function copyTask(n){view='create';render();setTimeout(()=>{document.getElementById('taskName').value=`${n}-copy`;toast('已复制任务配置')},0)}
    render();
  </script>
</body>
</html>
