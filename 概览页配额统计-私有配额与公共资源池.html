      statContent.innerHTML = `${overview}${trendSection()}${source === 'private' ? privateDetails() : ''}${storageOverview()}${publicStorageTrendSection()}`;
      bindEvents();
    };
    bindEvents = function () {
      const projectFilter = document.getElementById('project-filter');
      if (projectFilter) projectFilter.onchange = event => {
        const projects = [...new Set(projectRows.map(item => item.project))];
        if (projects.includes(event.target.value)) { project = event.target.value; spec = 'all'; render(); }
        else { toast('请选择有权限查看的项目'); event.target.value = project; }
      };
      const specFilter = document.getElementById('spec-filter');
      if (specFilter) specFilter.onchange = event => { spec = event.target.value; render(); };
      const monitor = document.getElementById('view-monitor'); if (monitor) monitor.onclick = openMonitor;
      const gpuToggle = document.getElementById('toggle-gpu-details');
      if (gpuToggle) gpuToggle.onclick = () => { gpuDetailExpanded = !gpuDetailExpanded; render(); };
      const gpuFilter = document.getElementById('gpu-trend-filter'); if (gpuFilter) gpuFilter.onchange = event => { gpuTrend = event.target.value; render(); };
      const apply = document.getElementById('apply-custom-range');
      if (apply) apply.onclick = () => {
        const start = document.getElementById('custom-start').value, end = document.getElementById('custom-end').value, days = (new Date(end) - new Date(start)) / 86400000;
        if (!start || !end || start > end) { toast('请选择有效的起止日期'); return; }
        if (days > 90) { toast('时间范围最长为 90 天'); return; }
        if (!trendData[source].dates.some(date => date >= start && date <= end)) { toast('所选时间范围暂无趋势数据'); return; }
        customStart = start; customEnd = end; render(); toast(`已应用时间范围：${start} 至 ${end}`);
      };
    };
    render();
  </script>
  <style>
    .project-picker{position:relative;width:230px}.project-picker .project-input{width:100%;padding-right:38px}.project-picker-toggle{position:absolute;top:1px;right:1px;width:36px;height:36px;border:0;color:#67758c;background:transparent;font-size:16px}.project-option-panel{position:absolute;z-index:8;top:44px;left:0;width:100%;max-height:236px;overflow-y:auto;padding:5px;border:1px solid #dce3ee;border-radius:6px;background:#fff;box-shadow:0 8px 22px rgba(31,48,80,.14)}.project-option-panel[hidden]{display:none}.project-option{display:block;width:100%;height:34px;padding:0 10px;border:0;border-radius:4px;color:#3f4f68;background:#fff;text-align:left}.project-option:hover,.project-option.active{color:#2f6bff;background:#edf3ff}.domain-control-header{justify-content:flex-end;padding-bottom:0}.domain-meta{text-align:right}.domain-meta p{margin:0 0 7px;color:#8a96a9;font-size:13px}.scope-control{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border:1px solid #bfd3ff;border-radius:8px;background:#f5f8ff}.scope-control-label{color:#315fbd;font-size:13px;font-weight:700;white-space:nowrap}.scope-control .project-picker{width:260px}.scope-control .project-input{height:36px;border-color:#a9c4ff;background:#fff;font-weight:600}.scope-control .project-option:first-child{margin-bottom:4px;border-bottom:1px solid #e8eefb}.domain-subsection>.card-header>.tools{margin-left:auto;justify-content:flex-end}
  </style>
  <script>
    privateDetails = function () {
      const projects = [...new Set(projectRows.map(item => item.project))];
      const specs = [...new Set(projectRows.map(item => item.spec))];
      const order = ['CPU','内存','NVIDIA A800 80G','NVIDIA L40S','NVIDIA H20'];
      const rows = projectRows.filter(item => item.project === project && (spec === 'all' || item.spec === spec)).sort((a,b) => order.indexOf(a.spec) - order.indexOf(b.spec));
      const tableRows = rows.map(item => { const rate = percent(item.used,item.total); return `<tr><td class="project">${item.project}</td><td><span class="spec-tag">${item.spec}</span></td><td>${format(item.used)} ${item.unit}</td><td>${format(item.total)} ${item.unit}</td><td><div class="bar-cell"><div class="mini-meter"><i style="width:${rate}%"></i></div><span class="rate">${rate}%</span></div></td></tr>`; }).join('') || '<tr><td colspan="5"><div class="empty">暂无匹配资源</div></td></tr>';
      return `<section class="section-card"><div class="card-header"><div><h3>项目资源使用明细</h3><p>仅展示当前用户有权限查看的项目；默认按 CPU、内存、GPU 卡型排序。</p></div><div class="tools"><div class="project-picker"><input id="project-filter" class="project-input" value="${project}" placeholder="搜索或选择项目" autocomplete="off" aria-label="搜索项目"/><button id="toggle-project-picker" class="project-picker-toggle" type="button" aria-label="展开项目列表">⌄</button><div id="project-option-panel" class="project-option-panel" hidden>${projects.map(item => `<button class="project-option ${item===project?'active':''}" type="button" data-project="${item}">${item}</button>`).join('')}</div></div><select id="spec-filter" aria-label="资源规格"><option value="all">全部资源规格</option>${specs.map(item => `<option value="${item}" ${item===spec?'selected':''}>${item}</option>`).join('')}</select><button id="view-monitor" class="sort">查看资源监控详情</button></div></div><div class="table-wrap"><table><thead><tr><th>项目</th><th>资源规格</th><th>已使用</th><th>总量</th><th>使用率</th></tr></thead><tbody>${tableRows}</tbody></table></div></section>`;
    };
    bindEvents = function () {
      const projectFilter = document.getElementById('project-filter');
      const projectPanel = document.getElementById('project-option-panel');
      const setProject = value => { project = value; spec = 'all'; render(); };
      if (projectFilter) {
        projectFilter.onfocus = () => { projectPanel.hidden = false; };
        projectFilter.oninput = () => {
          const keyword = projectFilter.value.trim().toLowerCase();
          projectPanel.hidden = false;
          projectPanel.querySelectorAll('[data-project]').forEach(item => { item.hidden = !item.dataset.project.toLowerCase().includes(keyword); });
        };
        projectFilter.onchange = () => {
          const names = [...new Set(projectRows.map(item => item.project))];
          if (names.includes(projectFilter.value)) setProject(projectFilter.value);
        };
      }
      const projectToggle = document.getElementById('toggle-project-picker');
      if (projectToggle) projectToggle.onclick = () => { projectPanel.hidden = !projectPanel.hidden; if (!projectPanel.hidden) projectFilter.focus(); };
      if (projectPanel) projectPanel.querySelectorAll('[data-project]').forEach(item => item.onclick = () => setProject(item.dataset.project));
      const specFilter = document.getElementById('spec-filter'); if (specFilter) specFilter.onchange = event => { spec = event.target.value; render(); };
      const monitor = document.getElementById('view-monitor'); if (monitor) monitor.onclick = openMonitor;
      const gpuToggle = document.getElementById('toggle-gpu-details'); if (gpuToggle) gpuToggle.onclick = () => { gpuDetailExpanded = !gpuDetailExpanded; render(); };
      const gpuFilter = document.getElementById('gpu-trend-filter'); if (gpuFilter) gpuFilter.onchange = event => { gpuTrend = event.target.value; render(); };
      const apply = document.getElementById('apply-custom-range');
      if (apply) apply.onclick = () => {
        const start = document.getElementById('custom-start').value, end = document.getElementById('custom-end').value, days = (new Date(end) - new Date(start)) / 86400000;
        if (!start || !end || start > end) { toast('请选择有效的起止日期'); return; }
        if (days > 90) { toast('时间范围最长为 90 天'); return; }
        if (!trendData[source].dates.some(date => date >= start && date <= end)) { toast('所选时间范围暂无趋势数据'); return; }
        customStart = start; customEnd = end; render(); toast(`已应用时间范围：${start} 至 ${end}`);
      };
    };
    render();
  </script>
  <script>
    function asDomainSubsection(html) {
      return html.replace('<section class="section-card">', '<div class="domain-subsection">').replace(/<\/section>$/, '</div>');
    }
    const tenantScope = '__tenant__';
    const isTenantScope = () => project === tenantScope;
    const scopeName = () => isTenantScope() ? '租户全局' : project;
    function projectCompute(projectName) {
      if (projectName === tenantScope) return resourceData.private.compute;
      return projectRows.filter(item => item.project === projectName).map(item => ({
        name: item.spec === 'CPU' || item.spec === '内存' ? item.spec : `GPU · ${item.spec}`,
        detail: item.spec === 'CPU' ? '核数' : item.spec === '内存' ? 'GiB' : '卡数',
        unit: item.unit,
        total: item.total,
        used: item.used
      }));
    }
    function projectTrendData(projectName) {
      if (projectName === tenantScope) return trendData.private;
      const items = projectCompute(projectName);
      const dates = trendData.private.dates;
      const factors = [.82,.86,.9,.94,.97,.99,1];
      const makeSeries = item => series(item.unit, factors.map(factor => Math.round(item.used * factor)), dates.map(() => item.total));
      const cpu = items.find(item => item.name === 'CPU') || {unit:'核',used:0,total:0};
      const memory = items.find(item => item.name === '内存') || {unit:'GiB',used:0,total:0};
      const gpuItems = items.filter(item => item.name.startsWith('GPU ·'));
      const gpuModels = {'GPU 总卡数':series('卡', factors.map(factor => Math.round(gpuItems.reduce((sum,item) => sum + item.used,0) * factor)), dates.map(() => gpuItems.reduce((sum,item) => sum + item.total,0)))};
      gpuItems.forEach(item => { gpuModels[item.name.replace('GPU · ','')] = makeSeries(item); });
      return {dates,cpu:makeSeries(cpu),memory:makeSeries(memory),gpuModels};
    }
    privateDetails = function () {
      const specs = [...new Set(projectRows.filter(item => item.project === project).map(item => item.spec))];
      const order = ['CPU','内存','NVIDIA A800 80G','NVIDIA L40S','NVIDIA H20'];
      const rows = projectRows.filter(item => item.project === project && (spec === 'all' || item.spec === spec)).sort((a,b) => order.indexOf(a.spec) - order.indexOf(b.spec));
      const tableRows = rows.map(item => { const rate = percent(item.used,item.total); return `<tr><td class="project">${item.project}</td><td><span class="spec-tag">${item.spec}</span></td><td>${format(item.used)} ${item.unit}</td><td>${format(item.total)} ${item.unit}</td><td><div class="bar-cell"><div class="mini-meter"><i style="width:${rate}%"></i></div><span class="rate">${rate}%</span></div></td></tr>`; }).join('') || '<tr><td colspan="5"><div class="empty">暂无匹配资源</div></td></tr>';
      return `<section class="section-card"><div class="card-header"><div><h3>项目资源使用明细</h3><p>当前项目：${project}；默认按 CPU、内存、GPU 卡型排序。</p></div><div class="tools"><select id="spec-filter" aria-label="资源规格"><option value="all">全部资源规格</option>${specs.map(item => `<option value="${item}" ${item===spec?'selected':''}>${item}</option>`).join('')}</select><button id="view-monitor" class="sort">查看资源监控详情</button></div></div><div class="table-wrap"><table><thead><tr><th>项目</th><th>资源规格</th><th>已使用</th><th>总量</th><th>使用率</th></tr></thead><tbody>${tableRows}</tbody></table></div></section>`;
    };
    const baseTrendSection = trendSection;
    trendSection = function () {
      if (source !== 'private') return baseTrendSection();
      const trends = projectTrendData(project);
      const index = trends.dates.map((date, i) => ({ date, i })).filter(item => item.date >= customStart && item.date <= customEnd).map(item => item.i);
      const labels = index.map(i => trends.dates[i].slice(5).replace('-', '/'));
      const clip = item => ({unit:item.unit,used:index.map(i => item.used[i]),total:index.map(i => item.total[i])});
      const range = `<div class="trend-controls"><span class="trend-unit">时间范围</span><input id="custom-start" type="date" value="${customStart}"/><span>至</span><input id="custom-end" type="date" value="${customEnd}"/><button id="apply-custom-range" class="sort">查询</button></div>`;
      const gpuOptions = Object.keys(trends.gpuModels);
      if (!gpuOptions.includes(gpuTrend)) gpuTrend = 'GPU 总卡数';
      const gpuSelector = `<select id="gpu-trend-filter" aria-label="GPU 趋势维度">${gpuOptions.map(item => `<option value="${item}" ${item===gpuTrend?'selected':''}>${item}</option>`).join('')}</select>`;
      const trendScopeTitle = isTenantScope() ? '租户全局计算资源水位趋势' : '项目计算资源水位趋势';
      const trendScopeDescription = isTenantScope() ? '纵轴按“已使用 / 总量”百分比统计。' : `当前项目：${project}；纵轴按“已使用 / 总量”百分比统计。`;
      return `<section class="section-card"><div class="card-header"><div><h3>${trendScopeTitle}</h3><p>${trendScopeDescription}</p></div>${range}</div><div class="trend-grid">${trendPanel('CPU 使用率趋势',clip(trends.cpu),labels)}${trendPanel('内存使用率趋势',clip(trends.memory),labels)}${trendPanel('GPU 使用率趋势',clip(trends.gpuModels[gpuTrend]),labels,gpuSelector)}</div></section>`;
    };
    render = function () {
      const data = resourceData[source];
      const isPublic = source === 'public';
      document.querySelectorAll('.segment').forEach(item => item.classList.toggle('active', item.dataset.source === source));
      sourceTip.hidden = true;
      const computeData = isPublic ? data.compute : projectCompute(project);
      const gpuModels = computeData.filter(item => item.name.startsWith('GPU ·'));
      const summary = [...computeData.filter(item => item.name === 'CPU' || item.name === '内存'), gpuTotal(computeData)];
      const projects = [...new Set(projectRows.map(item => item.project))];
      const privateDescription = isTenantScope() ? '当前展示租户全局计算资源使用情况；可切换至具体项目查看。' : `当前展示项目 ${project} 的计算资源使用情况。`;
      const scopePicker = `<div class="scope-control"><span class="scope-control-label">统计范围</span><div class="project-picker"><input id="project-filter" class="project-input" value="${scopeName()}" placeholder="搜索或选择项目" autocomplete="off" aria-label="搜索或选择项目"/><button id="toggle-project-picker" class="project-picker-toggle" type="button" aria-label="展开项目列表">⌄</button><div id="project-option-panel" class="project-option-panel" hidden><button class="project-option ${isTenantScope()?'active':''}" type="button" data-project="${tenantScope}">租户全局</button>${projects.map(item => `<button class="project-option ${item===project?'active':''}" type="button" data-project="${item}">${item}</button>`).join('')}</div></div></div>`;
      const monitorButton = `<button id="view-monitor" class="sort">查看资源监控详情</button>`;
      const computeOverview = `<div class="domain-subsection"><div class="card-header"><div><h3>${data.title}</h3><p>${isPublic ? data.description : privateDescription}</p></div><div class="tools">${isPublic ? '' : scopePicker}${isPublic ? '' : monitorButton}</div></div><div class="resource-grid">${summary.map(item => card(item, false, isPublic ? '已分配 / 配额' : '已使用 / 总量')).join('')}</div>${gpuDetailSection(gpuModels)}</div>`;
      const computeBlock = `<section class="section-card domain-card"><div class="domain-header domain-control-header"><div id="source-switch" class="segmented" aria-label="计算资源来源"><button class="segment ${source==='private'?'active':''}" data-source="private">私有资源</button><button class="segment ${source==='public'?'active':''}" data-source="public">公有资源</button></div></div>${computeOverview}${asDomainSubsection(trendSection())}</section>`;
      const storageBlock = `<section class="section-card domain-card"><div class="domain-header"><div><h3>存储资源</h3></div><div class="domain-meta"><p>文件存储、对象存储与云盘按租户维度独立展示，不受计算资源来源切换影响。</p></div></div>${asDomainSubsection(storageOverview())}${asDomainSubsection(publicStorageTrendSection())}</section>`;
      statContent.innerHTML = `${computeBlock}${storageBlock}`;
      bindEvents();
    };
    const baseOpenMonitor = openMonitor;
    openMonitor = function () {
      if (!isTenantScope()) return baseOpenMonitor();
      const rows = Object.values(physicalResources).flat();
      document.getElementById('overview-page').hidden = true;
      const page = document.getElementById('monitor-page');
      page.hidden = false;
      page.innerHTML = `<div class="detail-page-head"><button id="back-overview" class="back" aria-label="返回概览">‹</button><h1>租户全局资源监控详情</h1></div><div class="monitor-note"><span class="info">ⓘ</span><span>查看租户全局的机器与任务资源使用情况；使用率反映实际资源利用水平。</span></div><div class="monitor-tabs"><button class="monitor-tab ${monitorTab==='machines'?'active':''}" data-tab="machines">机器资源</button><button class="monitor-tab ${monitorTab==='tasks'?'active':''}" data-tab="tasks">任务资源</button></div><section class="section-card"><div class="physical-toolbar"><div><h3 style="margin:0">${monitorTab==='machines'?'机器资源列表':'任务资源列表'}</h3><p style="margin:5px 0 0;color:#8a96a9">${monitorTab==='machines'?'节点维度展示资源已使用、总量及使用率。':'任务/实例维度展示申请资源与实际使用率。'}</p></div></div>${monitorTab==='machines'?machineTable(rows):taskTable()}</section>`;
      document.getElementById('back-overview').onclick = () => { page.hidden = true; document.getElementById('overview-page').hidden = false; render(); };
      page.querySelectorAll('[data-tab]').forEach(item => item.onclick = () => { monitorTab = item.dataset.tab; openMonitor(); });
    };
    const baseBindEvents = bindEvents;
    bindEvents = function () {
      baseBindEvents();
      const projectFilter = document.getElementById('project-filter');
      const projectPanel = document.getElementById('project-option-panel');
      const selectScope = value => {
        const names = [tenantScope, ...new Set(projectRows.map(item => item.project))];
        if (!names.includes(value)) { toast('请选择可查看的租户全局或项目'); projectFilter.value = scopeName(); return; }
        project = value;
        spec = 'all';
        gpuTrend = 'GPU 总卡数';
        render();
        toast(`已切换至${scopeName()}`);
      };
      if (projectFilter && projectPanel) {
        projectFilter.onfocus = () => { projectPanel.hidden = false; };
        projectFilter.oninput = () => {
          const keyword = projectFilter.value.trim().toLowerCase();
          projectPanel.hidden = false;
          projectPanel.querySelectorAll('[data-project]').forEach(item => { item.hidden = !item.textContent.toLowerCase().includes(keyword); });
        };
        projectFilter.onchange = () => selectScope(projectFilter.value === '租户全局' ? tenantScope : projectFilter.value);
        const projectToggle = document.getElementById('toggle-project-picker');
        if (projectToggle) projectToggle.onclick = () => { projectPanel.hidden = !projectPanel.hidden; if (!projectPanel.hidden) projectFilter.focus(); };
        projectPanel.querySelectorAll('[data-project]').forEach(item => item.onclick = () => selectScope(item.dataset.project));
      }
      document.querySelectorAll('.segment').forEach(button => button.onclick = () => {
        if (source === button.dataset.source) return;
        source = button.dataset.source;
        gpuTrend = Object.keys(trendData[source].gpuModels)[0];
        render();
        toast(`已切换至${source === 'private' ? '私有资源' : '公有资源'}`);
      });
      const storageApply = document.getElementById('apply-storage-range');
      if (storageApply) storageApply.onclick = () => {
        const start = document.getElementById('storage-start').value;
        const end = document.getElementById('storage-end').value;
        const days = (new Date(end) - new Date(start)) / 86400000;
        if (!start || !end || start > end) { toast('请选择有效的存储趋势起止日期'); return; }
        if (days > 90) { toast('时间范围最长为 90 天'); return; }
        if (!trendData.public.dates.some(date => date >= start && date <= end)) { toast('所选时间范围暂无存储趋势数据'); return; }
        storageStart = start;
        storageEnd = end;
        render();
        toast(`已应用存储趋势时间范围：${start} 至 ${end}`);
      };
    };
    render();
  </script>
