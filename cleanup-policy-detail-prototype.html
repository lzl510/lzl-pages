          $('#policy-state-text').textContent = '已启用';
          toast('清理策略已启用');
        } else {
          e.target.checked = true;
          openModal('disable');
        }
      });
    }
    function toast(message, kind='success') { const el = $('#toast'); el.className = `toast ${kind} show`; el.innerHTML = `<span>${kind === 'success' ? '✓' : 'ⓘ'}</span>${escapeHTML(message)}`; clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }
    function setOverlay(show) { $('#overlay').classList.toggle('show', show); $('#overlay').setAttribute('aria-hidden', String(!show)); }
    function openModal(kind) {
      const modal = $('#modal');
      if (kind === 'edit' || kind === 'create') {
        const creating = kind === 'create';
        modal.innerHTML = `<div class="modal-header"><h2>${creating ? '创建清理策略' : '编辑清理策略'}</h2><button class="icon-btn" aria-label="关闭" data-action="close-modal">×</button></div>
          <form id="policy-form" data-mode="${creating ? 'create' : 'edit'}"><div class="modal-body"><div class="form-field"><label for="field-name">策略名称</label><input id="field-name" class="field-control" required value="${creating ? '' : escapeHTML(policy.name)}" placeholder="请输入策略名称" /></div>
          <div class="form-field"><label for="field-scope">实例范围</label><select id="field-scope" class="field-control"><option value="workspace">workspace</option><option value="rjob">rjob</option><option value="开发机">开发机</option></select></div>
          <div class="form-field"><label for="field-idle">闲置时长（小时）</label><input id="field-idle" class="field-control" type="number" min="1" value="${policy.idle}" /></div>
          <div class="form-field"><label for="field-method">处理策略</label><select id="field-method" class="field-control"><option value="仅通知">仅通知</option><option value="关闭">关闭</option></select></div></div>
          <div class="modal-footer">${button('取消', 'ghost', 'close-modal')}${button(creating ? '创建' : '保存', 'primary', 'save-policy')}</div></form>`;
        $('#field-scope').value = policy.scope; $('#field-method').value = policy.method;
      } else if (kind === 'disable') {
        modal.innerHTML = `<div class="modal-header"><h2>停用清理策略</h2><button class="icon-btn" aria-label="关闭" data-action="close-modal">×</button></div><div class="modal-body"><p class="confirm-copy">确定要停用清理策略 <strong>“${escapeHTML(policy.name)}”</strong> 吗？停用后，该策略将不再触发新的清理动作；历史执行记录不会受到影响。</p></div><div class="modal-footer">${button('取消', 'ghost', 'close-modal')}${button('确认停用', 'danger', 'confirm-disable')}</div>`;
      } else {
        modal.innerHTML = `<div class="modal-header"><h2>删除清理策略</h2><button class="icon-btn" aria-label="关闭" data-action="close-modal">×</button></div><div class="modal-body"><p class="confirm-copy">确定要删除清理策略 <strong>“${escapeHTML(policy.name)}”</strong> 吗？删除后将不再执行该策略，但历史审计记录不会被删除。</p></div><div class="modal-footer">${button('取消', 'ghost', 'close-modal')}${button('确认删除', 'danger', 'confirm-delete')}</div>`;
      }
      setOverlay(true); modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
    }
    function closeModal() { $('#modal').classList.remove('show'); $('#modal').setAttribute('aria-hidden','true'); setOverlay(false); }
    function savePolicy() {
      const name = $('#field-name').value.trim();
      if (!name) { toast('请输入策略名称', 'warning'); $('#field-name').focus(); return; }
      if ($('#policy-form').dataset.mode === 'create') { closeModal(); toast(`已创建策略“${name}”（原型演示）`); return; }
      policy.name = name; policy.scope = $('#field-scope').value; policy.idle = Number($('#field-idle').value) || policy.idle; policy.method = $('#field-method').value; policy.updatedAt = '2026/08/17 10:30:00'; closeModal(); renderApp(); toast('清理策略已保存');
    }
    function saveInlinePolicy() {
      const name = $('#inline-name').value.trim();
      if (!name) { toast('请输入策略名称', 'warning'); $('#inline-name').focus(); return; }
      policy.name = name;
      policy.scope = $('#inline-scope').value;
      policy.metricName = $('#inline-metric').value;
      policy.metricValue = Math.max(0, Math.min(100, Number($('#inline-metric-value').value) || 0));
      policy.metric = `${policy.metricName} ≤ ${policy.metricValue}%`;
      policy.idle = Math.max(1, Number($('#inline-idle').value) || 1);
      policy.method = $('#inline-method').value;
      if ($('#inline-notify-method')) policy.notifyMethod = $('#inline-notify-method').value;
      if ($('#inline-notify-url')) policy.notifyUrl = $('#inline-notify-url').value.trim();
      policy.updatedAt = '2026/08/17 10:30:00';
      state.isEditing = false;
      renderApp();
      toast('清理策略已保存');
    }
    function handleAction(action, el, sourceEvent) {
      if (el.dataset.policyId) selectPolicy(el.dataset.policyId);
      if (action === 'open-detail') { state.view = 'detail'; state.detailTab = 'detail'; state.isEditing = false; renderApp(); }
      if (action === 'back-list') { state.view = 'list'; state.isEditing = false; renderApp(); }
      if (action === 'tab-detail') { state.detailTab = 'detail'; renderApp(); }
      if (action === 'tab-audit') { state.view = 'detail'; state.detailTab = 'audit'; state.isEditing = false; renderApp(); }
      if (action === 'open-audit-from-list') { state.view = 'groupAudit'; state.auditQuery = ''; state.auditPolicy = '全部策略'; state.auditResource = '全部资源'; state.timeRange = '全部时间'; state.page = 1; renderApp(); }
      if (action === 'edit-policy') {
        state.view = 'detail';
        state.detailTab = 'detail';
        state.isEditing = true;
        renderApp();
      }
      if (action === 'enable-policy') {
        policy.enabled = true;
        policy.updatedAt = '2026/08/17 10:45:00';
        renderApp();
        toast('清理策略已启用');
      }
      if (action === 'disable-policy') openModal('disable');
      if (action === 'cancel-inline-edit') { state.isEditing = false; renderApp(); toast('已取消本次修改', 'warning'); }
      if (action === 'save-inline-edit') saveInlinePolicy();
      if (action === 'add-metric') toast('最多可添加 3 个监控指标（原型演示）');
      if (action === 'create-policy') openModal('create');
      if (action === 'delete-policy') openModal('delete');
      if (action === 'close-modal') closeModal();
      if (action === 'save-policy') { sourceEvent?.preventDefault(); savePolicy(); }
      if (action === 'confirm-disable') {
        policy.enabled = false;
        policy.updatedAt = '2026/08/17 10:45:00';
        closeModal();
        renderApp();
        toast('清理策略已停用', 'warning');
      }
      if (action === 'confirm-delete') { state.deletedIds.push(policy.id); closeModal(); state.view = 'list'; renderApp(); toast('清理策略已删除', 'warning'); }
      if (action === 'refresh-list' || action === 'refresh-audit') toast('数据已刷新');
      if (action === 'open-event-instance-detail') {
        const event = auditEvents.find(item => item.id === el.dataset.eventId);
        const instance = event?.instances.find(item => item.id === el.dataset.instanceId);
        if (!event || !instance) return;
        const eventPolicy = policies.find(item => item.id === event.policyId) || policy;
        state.selectedInstance = instance;
        state.instanceOrigin = { view:state.view, detailTab:state.detailTab, trigger:event.trigger, method:event.method, policyName:eventPolicy.name };
        state.view = 'instanceDetail';
        renderApp();
      }
      if (action === 'back-to-audit') {
        const origin = state.instanceOrigin;
        state.view = origin?.view || 'groupAudit';
        state.detailTab = origin?.detailTab || 'audit';
        renderApp();
      }
      if (action === 'prev-page') { state.page = Math.max(1, state.page - 1); renderApp(); }
      if (action === 'next-page') { const scope = state.view === 'groupAudit' ? 'group' : 'policy'; const pages = Math.ceil(getAuditRecords(scope).length / state.pageSize); state.page = Math.min(pages, state.page + 1); renderApp(); }
    }
    document.addEventListener('click', event => { const target = event.target.closest('[data-action]'); if (target) handleAction(target.dataset.action, target, event); if (event.target === $('#overlay')) closeModal(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { if (state.view === 'instanceDetail') handleAction('back-to-audit'); else closeModal(); } });
    renderApp();
  </script>
</body>
</html>
