    function statCard(key,label,hint,cls=''){return `<button class="stat ${cls} ${statFilter===key?'active':''}" onclick="filterByStat('${key}')"><div class="stat-label">${label}</div><div class="stat-value">${statCount(key)}</div><div class="stat-hint">${hint}</div></button>`}

        :`${statCard('faultNodes','当前故障节点','当前有效故障去重','danger')}${statCard('hwPending','待处理事件','故障尚未修复','warning')}${statCard('hwLocked','已隔离节点','引用机器管理状态')}${statCard('hwRepair','已修复事件','故障已消除','success')}`;
      const tabs=isTask?[['all','全部'],['pending','待处理'],['processing','恢复中'],['recovered','已恢复'],['failed','恢复失败']]:[['all','全部'],['pending','待处理'],['recovered','已修复']];
      main.innerHTML=`
        <div class="breadcrumb">Admin后台 / 故障事件中心</div>
        <div class="page-title-row"><div><h1 class="page-title">故障事件中心</h1><p class="page-desc">${isTask?'聚合训练任务异常，展示自动恢复资格、系统执行进度与最终结果。':'聚合硬件采集事件，展示故障证据、关联节点及受影响任务。'}</p></div><div class="page-actions">${isTask?'<span class="tag task">● 自动刷新中 · 10秒</span>':'<button class="btn" onclick="toast(\'事件数据已刷新\')">↻ 刷新</button>'}<button class="btn" onclick="toast('已导出当前筛选结果')">⇩ 导出</button></div></div>
        <div class="perspective-bar"><div class="perspective-switch"><button class="${!isTask?'active':''}" onclick="setPerspective('hardware')">▦ 硬件故障</button><button class="${isTask?'active':''}" onclick="setPerspective('task')">▤ 任务异常</button></div><span class="perspective-note">${isTask?'以Job为主体，查看任务异常、关联硬件证据及恢复过程':'以节点/GPU为主体，查看硬件证据、隔离维修及受影响任务'}</span></div>
        ${isTask?'<div class="relation-banner"><div><b>任务恢复仅由系统自动执行</b><span>用户开启自愈且命中一期规则时，平台自动恢复一次；未开启、归因不足或恢复失败的任务统一转人工，并跳转任务管理处理。</span></div><span class="tag task">每10秒刷新</span></div>':''}
        <section class="stats">${stats}</section>

          <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${activeTab===k?'active':''}" onclick="setTab('${k}')">${l}<span class="tab-count">${tabCount(k)}</span></button>`).join('')}</div>
          <div class="toolbar">
            <div class="search"><input id="keyword" value="${esc(filters.keyword)}" placeholder="${isTask?'Job ID、任务名称、故障Pod':'事件ID、节点名称、任务名称'}"><span>⌕</span></div>
            <select id="quickSeverity" class="filter-select"><option value="all">全部等级</option><option value="critical">致命</option><option value="high">严重</option><option value="medium">警告</option><option value="low">提示</option></select>
            <select id="quickImpact" class="filter-select">${isTask?'<option value="all">全部归因</option><option value="yes">关联硬件故障</option><option value="no">纯任务问题</option>':'<option value="all">全部影响</option><option value="yes">影响任务</option><option value="no">无运行任务</option>'}</select>

            <button class="btn" onclick="toggleAdvanced()">⌄ ${advancedOpen?'收起':'展开'}筛选</button><button class="btn ghost" onclick="resetFilters()">重置</button>
          </div>
          <div class="advanced ${advancedOpen?'show':''}">
            <div class="filter-field"><label>故障类型</label><select id="fType"><option value="all">全部类型</option>${[...new Set(events.map(e=>e.type))].map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div>
            <div class="filter-field"><label>事件来源</label><select id="fSource"><option value="all">全部来源</option><option value="hardware">硬件采集</option><option value="task">训练任务</option><option value="k8s">Kubernetes</option></select></div>
            <div class="filter-field"><label>集群</label><select id="fCluster"><option value="all">全部集群</option><option value="x86test">x86test</option></select></div>
            <div class="filter-field"><label>时间范围</label><select id="fTime"><option value="all">全部时间</option><option value="today">今天</option><option value="24h">最近24小时</option><option value="7d">最近7天</option></select></div>
            <div class="filter-field"><label>资源组</label><select><option>全部资源组</option><option>llm-prod-a</option><option>shared-gpu-b</option><option>research-c</option></select></div>
            <div class="filter-field"><label>${isTask?'恢复状态':'节点状态'}</label><select>${isTask?'<option>全部恢复状态</option><option>待处理</option><option>恢复中</option><option>已恢复</option><option>恢复失败</option>':'<option>全部节点状态</option><option>待锁定</option><option>锁定中</option><option>已锁定</option><option>待复查</option>'}</select></div>
          </div>
          ${isTask?taskTable(rows):hardwareTable(rows)}
          <div class="pagination"><span>共 ${rows.length} 条</span><select class="filter-select" style="min-width:92px"><option>10条/页</option></select><button class="page-num">‹</button><button class="page-num active">1</button><button class="page-num">2</button><button class="page-num">›</button></div>
        </section>`;

    function hardwareTable(rows){return `<div class="table-wrap"><table class="event-table"><colgroup><col style="width:235px"><col style="width:205px"><col style="width:175px"><col style="width:185px"><col style="width:175px"><col style="width:145px"><col style="width:135px"><col style="width:135px"><col style="width:80px"></colgroup><thead><tr><th>硬件故障</th><th>故障对象</th><th>关联信号</th><th>影响范围</th><th>初步结论</th><th>节点状态</th><th>故障状态</th><th>最近发生</th><th>操作</th></tr></thead><tbody>${rows.length?rows.map(eventRow).join(''):`<tr><td colspan="9"><div class="empty">暂无符合筛选条件的硬件故障</div></td></tr>`}</tbody></table></div>`}
    function taskTable(rows){return `<div class="table-wrap"><table class="task-view-table"><colgroup><col style="width:205px"><col style="width:160px"><col style="width:175px"><col style="width:175px"><col style="width:185px"><col style="width:180px"><col style="width:155px"><col style="width:110px"><col style="width:80px"></colgroup><thead><tr><th>Job ID / 任务名称</th><th>租户 / 空间</th><th>任务异常</th><th>受影响实例</th><th>关联硬件</th><th>恢复状态</th><th>系统动作</th><th>最近发生</th><th>操作</th></tr></thead><tbody>${rows.length?rows.map(taskViewRow).join(''):`<tr><td colspan="9"><div class="empty">暂无符合筛选条件的异常任务</div></td></tr>`}</tbody></table></div>`}
    function taskActionSummary(e){const plan=recoveryPlan(e);if(plan.type==='auto')return {title:'系统自动恢复',sub:plan.reason};if(plan.type==='completed')return {title:'本次处置已完成',sub:plan.reason};if(plan.type==='none')return {title:'无需任务恢复',sub:plan.reason};return {title:'转人工处理',sub:plan.reason}}
    function taskViewRow(r){const e=r.event,hardware=e.sources.hardware>0,policy=healingPolicy(e),plan=recoveryPlan(e),action=taskActionSummary(e);return `<tr><td><div style="margin-bottom:5px">${severityTag(e.severity)} <span class="tag task">${esc(r.kind)}</span></div><button class="event-title" onclick="openTaskDetail('${e.id}','${r.id}')">${esc(r.id)}</button><span class="event-id">${esc(r.name)}</span></td><td><b>${esc(e.tenant)}</b><span class="sub">${esc(e.space)} / ${esc(e.group)}</span></td><td><b>${esc(e.title)}</b><span class="sub">${esc(e.root)} · ${e.confidence}置信度</span></td><td>${r.workers} Worker / ${r.ranks} Rank<span class="sub">${esc(r.pod)}</span></td><td>${hardware?`<button class="object-link" onclick="showMachine('${e.id}')">${esc(e.node)}</button><span class="sub">${esc(e.gpu)} · ${esc(e.nodeState)}</span>`:'<span class="tag neutral">无硬件异常</span><span class="sub">节点保持可调度</span>'}</td><td><span class="job-status ${plan.type==='completed'?'ok':''}">${esc(automationState(e))}</span><span class="sub">${policy.enabled?'自愈已开启':'自愈未开启'} · ${esc(policy.source)}</span></td><td><span class="recommend">${esc(action.title)}</span><span class="sub">${e.ticket!=='--'?'工单 '+e.ticket:esc(action.sub)}</span></td><td>${esc(e.latest)}<span class="sub">事件 ${e.id.slice(-3)}</span></td><td><button class="text-link" onclick="openTaskDetail('${e.id}','${r.id}')">详情</button>${e.status==='pending'?`<button class="text-link" style="display:block;margin-top:8px" onclick="openRecoveredModal('${e.id}')">已恢复</button>`:''}</td></tr>`}
    function eventRow(e){return `<tr>
      <td><div style="margin-bottom:5px">${severityTag(e.severity)}</div><button class="event-title" onclick="openDetail('${e.id}')">${esc(e.title)}</button><span class="event-id">${e.id}</span></td>
      <td><span class="sub" style="margin:0 0 3px">${e.cluster} / ${e.group}</span><button class="object-link" onclick="showMachine('${e.id}')">${esc(e.node)}</button><span class="sub">${esc(e.gpu)}</span></td>
      <td><div class="source-tags">${sourceTags(e.sources)}</div><span class="sub">共 ${Object.values(e.sources).reduce((a,b)=>a+b,0)} 条原始信号</span></td>
      <td>${e.hasTask?`<b>${e.tasks.length} 个任务</b><button class="object-link" style="display:block;margin-top:3px" onclick="openJob('${e.jobIds[0]}')">${esc(e.jobIds[0])}</button><span class="sub">${esc(e.tasks[0])}${e.tasks.length>1?' 等':''}</span><span class="sub">${e.workers} Worker / ${e.ranks} Rank</span>`:`<span class="tag neutral">无运行任务</span><span class="sub">无需任务恢复</span>`}</td>
      <td><b>${esc(e.root)}</b><span class="sub">置信度 ${e.confidence} · ${e.score}%</span></td>
      <td><span class="node-state ${e.nodeState.includes('失败')?'failed':e.nodeState.includes('锁定')?'locked':e.nodeState==='可调度'?'ok':''}">${esc(e.nodeState)}</span><button class="text-link" onclick="showMachine('${e.id}')" style="margin-top:4px;font-size:12px">查看机器</button></td>
      <td>${hardwareStatusTag(e.status)}</td><td>${esc(e.latest)}<span class="sub">首次 ${esc(e.first)}</span></td><td><button class="text-link" onclick="openDetail('${e.id}')">详情</button>${e.status!=='recovered'?`<button class="text-link" style="display:block;margin-top:8px" onclick="openRecoveredModal('${e.id}',true)">已修复</button>`:''}</td>
    </tr>`}
    function bindListFilters(){
      const k=document.getElementById('keyword'),s=document.getElementById('quickSeverity'),i=document.getElementById('quickImpact');s.value=filters.severity;i.value=filters.impact;
      k.addEventListener('input',e=>{filters.keyword=e.target.value;renderList()});s.addEventListener('change',e=>{filters.severity=e.target.value;renderList()});i.addEventListener('change',e=>{filters.impact=e.target.value;renderList()});
      [['fType','type'],['fSource','source'],['fCluster','cluster'],['fTime','time']].forEach(([id,key])=>{const el=document.getElementById(id);if(!el)return;el.value=filters[key];el.addEventListener('change',e=>{filters[key]=e.target.value;renderList()})});
    }
    function filterByStat(key){
      statFilter=statFilter===key?null:key;
      const map={faultNodes:'all',hwPending:'pending',hwLocked:'all',hwRepair:'recovered',taskAll:'all',taskPending:'pending',taskProcessing:'processing',taskRecovered:'recovered',taskFailed:'failed'};
      activeTab=statFilter?map[key]||'all':'all';renderList();
    }
    function setPerspective(value){perspective=value;view='list';selectedEventId=null;selectedJobId=null;activeTab='all';statFilter=null;filters={keyword:'',severity:'all',type:'all',source:'all',cluster:'all',impact:'all',time:'all'};renderList();window.scrollTo(0,0)}
    function setTab(tab){activeTab=tab;statFilter=null;renderList()}
    function toggleAdvanced(){advancedOpen=!advancedOpen;renderList()}
    function resetFilters(){filters={keyword:'',severity:'all',type:'all',source:'all',cluster:'all',impact:'all',time:'all'};statFilter=null;activeTab='all';renderList()}
    function openDetail(id){perspective='hardware';selectedEventId=id;selectedJobId=null;view='detail';sourceTab='all';renderDetail();window.scrollTo(0,0)}
    function renderDetail(){
      const e=events.find(x=>x.id===selectedEventId);if(!e){backToList();return}

        <div class="breadcrumb">Admin后台 / 故障事件中心 / 硬件故障 / ${e.id}</div>
        <div class="detail-head"><button class="back" onclick="backToList()">‹</button><div class="detail-title-wrap"><h1 class="detail-title">${esc(e.title)} ${severityTag(e.severity)} ${hardwareStatusTag(e.status)}</h1><div class="detail-sub"><span>${e.id}</span><span>首次发生 ${esc(e.first)}</span><span>最近更新 ${esc(e.latest)}</span></div></div><div class="page-actions"><span class="tag task">● 自动刷新中 · 10秒</span></div></div>

    function overviewCard(e){return `<section class="card"><h2 class="card-title">故障概要</h2><div class="info-grid">
      <div class="info"><label>集群 / 资源组</label><b>${e.cluster} / ${e.group}</b></div><div class="info"><label>故障节点</label><button class="text-link node-link" onclick="showMachine('${e.id}')">${esc(e.node)} ↗</button><span>进入机器管理详情</span></div><div class="info"><label>GPU</label><b>${esc(e.gpu)}</b></div>
      <div class="info"><label>节点调度状态</label><b>${esc(e.nodeState)}</b></div><div class="info"><label>受影响任务</label>${e.hasTask?`<button class="text-link" onclick="document.getElementById('affectedJobs').scrollIntoView({behavior:'smooth'})">${e.tasks.length} 个 · 查看任务</button>`:'<b>无运行任务</b>'}</div><div class="info"><label>硬件事件 / 运维工单</label><b>${esc(e.ticket!=='--'?e.ticket:e.hardwareId)}</b></div>
      <div class="info"><label>锁定记录</label><b>${esc(e.lockId)}</b></div><div class="info"><label>锁定原因</label><b>${esc(e.lockReason)}</b></div><div class="info"><label>事件来源</label><div class="mini-tags">${sourceTags(e.sources)}</div></div>
    </div></section>`}
    function analysisCard(e){return `<section class="card"><h2 class="card-title">根因分析 <small>由故障规则生成，可追溯判断依据</small></h2><div class="analysis-top"><div class="analysis-cell"><label>初步根因</label><strong>${esc(e.root)}</strong></div><div class="analysis-cell"><label>判断置信度</label><strong class="confidence">${e.confidence} · ${e.score}%</strong></div><div class="analysis-cell"><label>故障范围</label><strong>${e.nodeId==='MULTI'?'多个关联节点':'1个节点 · '+esc(e.gpu)}</strong></div></div><ul class="evidence">${e.evidence.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="rule-note">命中规则：${e.root==='任务配置问题'?'TASK-OOM-01 · 明确任务错误且节点健康':'GPU-NODE-FAULT-01 · 硬件强证据优先于任务表象'}。硬件视角只展示判断结果，不生成或执行节点处置意见。</div></section>`}
    function signalsCard(e){
      const signals=e.signals.filter(s=>sourceTab==='all'||s[0]===sourceTab);
      return `<section class="card"><h2 class="card-title">关联原始事件 <small>${e.signals.length} 条信号聚合为当前故障单</small></h2><div class="source-tabs">${[['all','全部'],['hardware','硬件事件'],['task','任务事件'],['k8s','平台事件']].map(([k,l])=>`<button class="source-tab ${sourceTab===k?'active':''}" onclick="setSourceTab('${k}')">${l}</button>`).join('')}</div><div class="signal-list">${signals.map(s=>`<div class="signal"><span class="tag ${s[0]}">${sourceLabels[s[0]]}</span><span class="signal-time">${esc(s[1])}</span><span class="signal-object">${esc(s[2])}</span><span class="signal-summary">${esc(s[3])}</span><span class="signal-time">${esc(s[4])}</span></div>`).join('')||'<div class="empty">暂无该来源的事件</div>'}</div></section>`
    }
    function setSourceTab(tab){sourceTab=tab;view==='taskDetail'?renderTaskDetail():renderDetail()}
    function affectedJobs(e){return e.tasks.map((name,i)=>({name,id:e.jobIds?.[i]||`job-unknown-${i+1}`,kind:e.taskKinds?.[i]||'训练任务',state:e.taskStatuses?.[i]||'受影响',pod:e.podNames?.[i]||'--',workers:e.jobWorkers?.[i]??e.workers,ranks:e.jobRanks?.[i]??e.ranks,checkpoint:e.jobCheckpoints?.[i]||e.checkpoint}))}
    function impactCard(e){
      const jobs=affectedJobs(e);

    }

    function taskOverviewCard(e,j){const policy=healingPolicy(e),plan=recoveryPlan(e);return `<section class="card"><h2 class="card-title">任务概要 <small>以Job为定位主键</small></h2><div class="info-grid">
      <div class="info"><label>Job ID</label><b class="job-id">${esc(j.id)}</b></div><div class="info"><label>任务名称 / 类型</label><b>${esc(j.name)} / ${esc(j.kind)}</b></div><div class="info"><label>当前状态</label><b>${esc(j.state)}</b></div>
      <div class="info"><label>租户 / 空间</label><b>${esc(e.tenant)} / ${esc(e.space)}</b></div><div class="info"><label>集群 / 资源组</label><b>${esc(e.cluster)} / ${esc(e.group)}</b></div><div class="info"><label>Worker / Rank</label><b>${j.workers} / ${j.ranks}</b></div>
      <div class="info"><label>故障自愈开关</label><b style="color:${policy.enabled?'#168a68':'#b26b00'}">${policy.enabled?'已开启':'未开启'}</b><span>${esc(policy.source)}</span></div><div class="info"><label>恢复处置状态</label><b>${esc(automationState(e))}</b><span>${esc(plan.reason)} · 最近同步 ${esc(e.latest)}</span></div><div class="info"><label>Checkpoint</label><b>${esc(j.checkpoint)}</b></div>
      <div class="info"><label>受影响Pod</label><b>${esc(j.pod)}</b></div><div class="info"><label>关联故障单</label><b>${e.id}</b></div><div class="info"><label>状态刷新</label><b>后台自动同步</b><span>硬件采集 / K8s / 任务控制器</span></div>
    </div></section>`}
    function taskDiagnosisCard(e,j){
      const abnormal=e.root==='任务配置问题'?'任务运行异常':e.root==='无法准确归因'?'分布式通信异常':e.root==='疑似节点影响'?'任务失败，疑似节点影响':'Worker因硬件故障退出';
      return `<section class="card"><h2 class="card-title">任务异常与根因 <small>任务信号和硬件信号联合判断</small></h2><div class="analysis-top"><div class="analysis-cell"><label>任务异常</label><strong>${esc(abnormal)}</strong></div><div class="analysis-cell"><label>初步根因</label><strong>${esc(e.root)}</strong></div><div class="analysis-cell"><label>判断置信度</label><strong class="confidence">${e.confidence} · ${e.score}%</strong></div></div><ul class="evidence">${e.evidence.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="rule-note">处理原则：${e.root==='任务配置问题'?'未发现节点硬件证据，不触发节点锁定。':'任务处置与节点处置使用同一故障结论，防止恢复任务再次调度到故障节点。'}</div></section>`
    }
    function taskHardwareCard(e,j){
      const hasHardware=e.sources.hardware>0||e.root.includes('硬件');
      if(!hasHardware)return `<section class="card"><h2 class="card-title">关联硬件状态</h2><div class="notice"><span>✓</span><div><b>未发现与本次任务异常相关的硬件故障。</b><br>节点 ${esc(e.node)} 保持可调度，本次建议不会触发节点锁定。</div></div></section>`;
      return `<section class="card"><h2 class="card-title">关联硬件故障 <small>从任务反查故障节点</small></h2><div class="relation-banner" style="margin:0"><div><b>${esc(e.node)} · ${esc(e.gpu)}</b><span>${esc(e.root)}　·　节点状态：${esc(e.nodeState)}　·　硬件事件：${esc(e.hardwareId)}</span></div></div><div class="rule-note">故障实例：${esc(j.pod)}；${e.root.includes('硬件')?'节点锁定成功前，任务控制器不得在该节点重新拉起 Worker。':'当前仅存在弱硬件信号，不直接锁定节点；先通过任务重启观察是否复现。'}</div></section>`
    }
    function taskSignalsCard(e,j){
      const signals=e.signals.filter(s=>sourceTab==='all'||s[0]===sourceTab);
      return `<section class="card"><h2 class="card-title">任务关联事件 <small>按时间关联任务、节点与K8s信号</small></h2><div class="source-tabs">${[['all','全部'],['task','任务事件'],['hardware','硬件事件'],['k8s','平台事件']].map(([k,l])=>`<button class="source-tab ${sourceTab===k?'active':''}" onclick="setSourceTab('${k}')">${l}</button>`).join('')}</div><div class="signal-list">${signals.map(s=>`<div class="signal"><span class="tag ${s[0]}">${sourceLabels[s[0]]}</span><span class="signal-time">${esc(s[1])}</span><span class="signal-object">${esc(s[2])}</span><span class="signal-summary">${esc(s[3])}</span><span class="signal-time">${esc(s[4])}</span><button class="text-link" onclick="toast('已打开原始日志')">日志</button></div>`).join('')||'<div class="empty">暂无该来源的事件</div>'}</div></section>`
    }
    function taskRecoveryCard(e,j){
      const plan=recoveryPlan(e);
      const attempts=plan.type==='completed'?'1次，已完成':e.status==='failed'?'1次，失败后已停止自动编排':e.status==='processing'||e.status==='verifying'?'第1次进行中':plan.type==='manual'?'未触发自动恢复':'尚未执行';
      const mode=plan.type==='manual'?'不执行自动恢复':e.root.includes('硬件')?'排除故障节点后整体重拉':'原资源池重新拉起';
      return `<section class="card"><h2 class="card-title">任务恢复记录 <small>后台持续同步自动恢复结果</small></h2><div class="recovery-metrics"><div><label>恢复状态</label><b>${esc(automationState(e))}</b></div><div><label>恢复尝试</label><b>${attempts}</b></div><div><label>恢复方式</label><b>${esc(mode)}</b></div><div><label>恢复起点</label><b>${esc(j.checkpoint)}</b></div><div><label>替代资源</label><b>${esc(e.replacement)}</b></div></div><div class="rule-note">一期仅执行一次自动恢复。未开启自愈、未命中规则或恢复失败时，事件中心停止自动编排并同步状态；人工操作在云3.0任务管理完成。</div><div class="timeline" style="margin-top:18px">${e.timeline.map(t=>`<div class="timeline-item ${t[0]}"><div class="timeline-row"><strong>${esc(t[1])}</strong><span class="timeline-system">${esc(t[2])}</span><span class="timeline-time">${esc(t[3])}</span></div><div class="timeline-desc">${esc(t[4])}</div></div>`).join('')}</div></section>`
    }
    function taskRecommendCard(e,j){
      const plan=recoveryPlan(e),isManual=plan.type==='manual';
      const heading=plan.type==='auto'?'系统自动恢复':isManual?'人工处理':'处置结果';
      const action=plan.type==='auto'?(e.root.includes('硬件')?'锁定节点后恢复任务':'自动重新拉起任务'):plan.type==='completed'?'任务恢复完成':plan.type==='none'?'无需任务恢复':'不执行自动恢复';
      const note=plan.type==='auto'?'平台正在按一期规则自动执行，管理员无需逐步确认。':isManual?'事件中心不执行手动恢复或重试。请在任务管理中查看任务详情并按既有流程处理。':'本次处置结果已由后台同步，无需继续操作。';
      const steps=plan.type==='auto'?`<ol class="step-preview">${actionSteps(e).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'';
      const link=isManual?`<div class="side-actions"><button class="btn primary" onclick="showTaskManagement('${e.id}','${j.id}')">查看云3.0任务详情 ↗</button></div>`:'';
      return `<section class="card recommend-card"><p class="recommend-title">${heading}</p><h2 class="recommend-action">${action}</h2><div class="confidence-row"><span>任务自愈开关</span><span class="score">${healingPolicy(e).enabled?'已开启':'未开启'}</span></div><div class="confidence-row"><span>当前状态</span><span>${esc(automationState(e))}</span></div><div class="confidence-row"><span>状态更新</span><span>后台自动刷新</span></div><p class="recommend-summary">Job ${esc(j.id)}，影响 ${j.workers} 个Worker / ${j.ranks} 个Rank。</p><div class="risk-box">${note}</div>${steps}${link}</section>`
    }
    function timelineCard(e){return `<section class="card"><h2 class="card-title">处置时间线 <small>记录系统、人员与结果</small></h2><div class="timeline">${e.timeline.map(t=>`<div class="timeline-item ${t[0]}"><div class="timeline-row"><strong>${esc(t[1])}</strong><span class="timeline-system">${esc(t[2])}</span><span class="timeline-time">${esc(t[3])}</span></div><div class="timeline-desc">${esc(t[4])}</div></div>`).join('')}</div></section>`}
    function actionSteps(e){
      if(e.root.includes('硬件'))return ['请求节点锁定','确认节点已不可调度','排除故障节点并重新拉起任务','从最近完整Checkpoint恢复','验证任务是否恢复运行'];
      return ['重新拉起训练任务','监控恢复后的运行状态','同步任务恢复结果'];
    }
    function backToList(){view='list';selectedEventId=null;selectedJobId=null;sourceTab='all';renderList();window.scrollTo(0,0)}
    function renderCurrentDetail(){view==='taskDetail'?renderTaskDetail():renderDetail()}
    function openActionModal(id){
      const e=events.find(x=>x.id===id);if(!e||['recovered','manual'].includes(e.status))return;
      const title=e.status==='failed'?'重试故障处置':'确认按建议处置';
      const needsLock=e.root.includes('硬件');
      modal.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="confirm-event"><strong>${esc(e.title)}</strong><span>${e.id}　·　${esc(e.node)}</span></div><div class="notice warning" style="margin-top:15px"><span>!</span><div>${needsLock?'系统会先确认节点锁定成功，再排除故障节点恢复任务。':'本次仅执行任务重启与恢复观察，不会锁定节点。'}</div></div><ol class="confirm-steps">${actionSteps(e).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="modal-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="executeSuggestion('${e.id}')">确认执行</button></div>`;showModal();
    }
    function executeSuggestion(id){
      const e=events.find(x=>x.id===id),now=new Date();if(!e)return;closeModal();e.status='processing';e.latest=now.toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
      if(e.root.includes('硬件')){e.nodeState='锁定中';e.timeline.push(['active','请求锁定节点','云平台管控',e.latest,'已提交节点锁定请求，等待节点管理返回结果'])}else{e.timeline.push(['active','重新拉起任务','云3.0',e.latest,'不锁定节点，正在重新拉起任务'])}
      renderCurrentDetail();toast('处置请求已提交');
      setTimeout(()=>{
        if(e.root.includes('硬件')){e.nodeState='已锁定';e.lockId=e.lockId==='--'?'LOCK-'+Math.floor(6100+Math.random()*700):e.lockId;e.timeline[e.timeline.length-1][0]='done';e.timeline.push(['done','节点锁定成功','云平台管控',timeNow(),'节点已禁止调度，资源状态已同步至机器管理'])}
        if(e.hasTask){e.status='verifying';e.timeline.push(['active','任务恢复验证','云3.0',timeNow(),e.root.includes('硬件')?'已排除故障节点并从Checkpoint重新拉起':'任务已重新拉起，正在观察是否复现'])}else{e.status='processing';e.timeline.push(['active','进入诊断维修','硬件运维',timeNow(),'节点无运行任务，已跳过任务恢复'])}
        e.latest=timeNow();if(selectedEventId===e.id&&(view==='detail'||view==='taskDetail'))renderCurrentDetail();toast(e.hasTask?'节点已锁定，任务正在恢复':'节点已锁定，已进入诊断维修');
      },1000)
    }
    function timeNow(){return new Date().toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'})}
    function openRecoveredModal(id,isHardware=false){
      const e=events.find(x=>x.id===id);if(!e||(isHardware?e.status==='recovered':e.status!=='pending'))return;
      const resultLabel=isHardware?'已修复':'已恢复';
      modal.innerHTML=`<div class="modal-head"><h2>确认${isHardware?'硬件故障已修复':'故障已恢复'}</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="confirm-event"><strong>${esc(e.title)}</strong><span>${esc(e.id)}　·　${esc(e.node)}</span></div><div class="notice warning" style="margin-top:15px"><span>!</span><div>确认后，事件状态将更新为“${resultLabel}”并记录操作时间。该操作不自动修改节点的锁定或调度状态。</div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmRecovered('${e.id}',${isHardware})">确认${resultLabel}</button></div>`;showModal();
    }
    function confirmRecovered(id,isHardware=false){
      const e=events.find(x=>x.id===id);if(!e||(isHardware?e.status==='recovered':e.status!=='pending'))return;
      e.status='recovered';e.latest=timeNow();if(e.hasTask)e.taskStatuses=e.taskStatuses.map(()=> '已恢复');
      e.timeline.push(['done',isHardware?'确认已修复':'确认已恢复','Admin后台',e.latest,isHardware?'管理员确认硬件故障已消除，事件进入已修复状态':'管理员确认故障影响已消除，事件进入已恢复状态']);
      closeModal();renderList();toast(`事件状态已更新为${isHardware?'已修复':'已恢复'}`);
    }
    function openManualModal(id){
      const e=events.find(x=>x.id===id);modal.innerHTML=`<div class="modal-head"><h2>转人工处理</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="confirm-event"><strong>${esc(e.title)}</strong><span>${e.id}　·　${esc(e.node)}</span></div><label class="form-label">转人工原因</label><textarea id="manualReason" class="textarea" placeholder="请输入需要人工介入的原因">当前故障归因或自动处置需要人工确认</textarea><div class="notice warning" style="margin-top:14px"><span>!</span><div>转人工后将停止该事件的自动任务重试和自动解锁，节点现有调度状态保持不变。</div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="confirmManual('${id}')">提交运维工单</button></div>`;showModal();
    }
    function openStopHealingModal(id){
      const e=events.find(x=>x.id===id),policy=e&&healingPolicy(e);if(!e||['manual','recovered'].includes(e.status))return;
      const isAuto=policy.enabled;
      const title=isAuto?'暂停自动处置并转人工':'中止手动自愈';
      const notice=isAuto?'暂停后，系统将停止后续自动重试和任务恢复步骤，并创建运维工单；已完成的节点锁定不会自动撤销，当前运行状态保持不变。':'中止后，本次手动触发的后续恢复步骤将停止；已完成的节点锁定不会自动撤销，当前运行状态保持不变。';
      const reason=isAuto?'管理员暂停自动处置，需人工接管':'管理员主动中止手动自愈';
      const confirmText=isAuto?'确认暂停并转人工':'确认中止';
      modal.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="confirm-event"><strong>${esc(e.tasks[0]||e.title)}</strong><span>${esc(e.jobIds?.[0]||e.id)}　·　当前状态：${esc(automationState(e))}</span></div><div class="notice warning" style="margin-top:15px"><span>!</span><div>${notice}</div></div><label class="form-label">${isAuto?'人工接管原因':'中止原因'}</label><textarea id="stopReason" class="textarea" placeholder="请输入原因">${reason}</textarea></div><div class="modal-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="confirmStopHealing('${id}',${isAuto})">${confirmText}</button></div>`;showModal();
    }
    function confirmStopHealing(id,isAuto){const e=events.find(x=>x.id===id);if(!e)return;const reason=(document.getElementById('stopReason')?.value||'未填写原因').trim();e.status='manual';if(isAuto&&e.ticket==='--')e.ticket='OPS-WO-'+Math.floor(3200+Math.random()*700);e.latest=timeNow();const title=isAuto?'自动处置已暂停并转人工':'手动自愈已中止';const detail=isAuto?`管理员暂停自动处置，已生成工单 ${e.ticket}；原因：${reason}`:`管理员中止本次手动自愈；原因：${reason}`;e.timeline.push(['active',title,isAuto?'云3.0 Admin → 运维工单':'云3.0 Admin',e.latest,detail]);closeModal();renderCurrentDetail();toast(isAuto?'自动处置已暂停，已转人工':'手动自愈已中止')}
    function confirmManual(id){const e=events.find(x=>x.id===id);if(!e)return;e.status='manual';e.ticket=e.ticket==='--'?'OPS-WO-'+Math.floor(3200+Math.random()*700):e.ticket;e.latest=timeNow();e.timeline.push(['active','转人工处理','硬件运维',e.latest,`已生成工单 ${e.ticket}，自动处置暂停`]);closeModal();renderCurrentDetail();toast('已转人工并生成运维工单')}
    function syncEvent(id){const e=events.find(x=>x.id===id);e.latest=timeNow();renderCurrentDetail();toast('已同步硬件采集、任务控制器与机器管理状态')}
    function openHardwareOps(id){const e=events.find(x=>x.id===id);modal.innerHTML=`<div class="modal-head"><h2>硬件运维入口</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="confirm-event"><strong>${esc(e.ticket!=='--'?e.ticket:e.hardwareId)}</strong><span>${esc(e.title)}</span></div><p style="color:#66758a">此处模拟跳转硬件运维系统，用于查看硬件诊断、维修工单和健康复查结果。</p></div><div class="modal-foot"><button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="closeModal();toast('已打开硬件运维系统')">打开运维系统 ↗</button></div>`;showModal()}
    function showTaskManagement(eventId,jobId){
      const e=events.find(x=>x.id===eventId),j=affectedJobs(e).find(x=>x.id===jobId);
      modal.innerHTML=`<div class="modal-head"><h2>云3.0任务详情</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body machine-sheet"><div class="machine-hero"><div class="machine-glyph">▤</div><div><strong style="font-size:17px">${esc(j.id)}</strong><span class="sub">${esc(j.name)} · ${esc(j.kind)}</span></div></div><div class="machine-meta"><div><label>当前状态</label><b>${esc(j.state)}</b></div><div><label>关联故障单</label><b>${esc(e.id)}</b></div><div><label>自动恢复状态</label><b>${esc(automationState(e))}</b></div><div><label>受影响Pod</label><b>${esc(j.pod)}</b></div></div><div class="notice"><span>ⓘ</span><div>事件中心不执行手动恢复或重试。请在任务管理中按既有权限和流程处理，处理结果将自动同步回当前故障事件。</div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="closeModal();toast('已跳转云3.0任务管理详情（原型）')">进入任务管理 ↗</button></div>`;showModal()
    }
    function showMachine(id){
      const e=events.find(x=>x.id===id);modal.innerHTML=`<div class="modal-head"><h2>机器详情 · 权威节点状态</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body machine-sheet"><div class="machine-hero"><div class="machine-glyph">▦</div><div><strong style="font-size:17px">${esc(e.node)}</strong><span class="sub">${esc(e.nodeId)} · ${e.cluster}</span></div><span style="margin-left:auto">${e.nodeState.includes('失败')?'<span class="status st-failed">锁定失败</span>':e.nodeState==='可调度'?'<span class="status st-recovered">可调度</span>':'<span class="status st-manual">'+esc(e.nodeState)+'</span>'}</span></div><div class="machine-meta"><div><label>当前调度状态</label><b>${esc(e.nodeState)}</b></div><div><label>锁定记录</label><b>${esc(e.lockId)}</b></div><div><label>锁定原因</label><b>${esc(e.lockReason)}</b></div><div><label>关联故障事件</label><b>${esc(e.id)}</b></div><div><label>硬件事件</label><b>${esc(e.hardwareId)}</b></div><div><label>运行任务</label><b>${e.hasTask?e.tasks.length+' 个':'0 个'}</b></div></div><div class="notice"><span>ⓘ</span><div>机器管理是节点状态的权威视图。故障事件中心只引用该状态，不维护另一份锁定开关。</div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="closeModal();toast('已跳转机器管理详情（原型）')">进入机器管理 ↗</button></div>`;showModal()
    }
    function showModal(){overlay.classList.add('show');modal.classList.add('show')}
    function closeModal(){overlay.classList.remove('show');modal.classList.remove('show')}
    overlay.addEventListener('click',closeModal);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    renderList();
  </script>
</body>
</html>
