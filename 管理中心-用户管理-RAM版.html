    function renderPolicies(){const rows=visiblePolicyList(),canCreate=state.role==='租户管理员',canGrant=writable();main.innerHTML=`<div class="page-head"><div><h1>权限策略</h1><p>通过系统策略和自定义策略定义可授予用户及用户组的权限集合。</p></div><div class="head-actions">${canCreate?'<button class="btn primary" onclick="openPolicyCreate()">＋ 创建权限策略</button>':''}</div></div><div class="scope-note">ⓘ ${state.role==='租户管理员'?'可维护自定义策略；系统策略由平台统一维护。':state.role==='租户观察员'?'当前为租户只读视角，可查看全部策略及其授权关系。':`可查看并使用项目级策略为 ${esc(state.project)} 授权，但不能维护策略目录。`}</div><div class="toolbar"><span class="spacer"></span><select id="policyListTypeFilter" class="filter"><option value="全部策略">全部策略</option><option value="system">系统策略</option><option value="custom">自定义策略</option></select><select id="policyListScopeFilter" class="filter"><option value="全部层级">全部层级</option>${state.role!=='项目管理员'?'<option value="tenant">租户级</option>':''}<option value="project">项目级</option></select><div class="search"><input id="policyListSearch" value="${esc(state.policyListKeyword)}" placeholder="搜索策略名称 / 描述"><span>⌕</span></div><button class="btn" onclick="toast('策略列表已刷新')">↻</button></div><div class="table-wrap"><table class="table" style="min-width:1060px"><colgroup><col style="width:240px"><col style="width:115px"><col style="width:115px"><col style="width:310px"><col style="width:120px"><col style="width:165px"><col style="width:250px"></colgroup><thead><tr><th>策略名称</th><th>策略类型</th><th>适用层级</th><th>描述</th><th>已关联授权</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${rows.map(p=>`<tr><td><button class="user-link" onclick="openPolicyDetail('${p.id}')">${esc(p.name)}</button><span class="sub">${esc(p.id)}</span></td><td>${p.type==='custom'?'<span class="chip tenant">自定义策略</span>':'<span class="chip muted">系统策略</span>'}</td><td><span class="chip ${p.scope==='tenant'?'tenant':''}">${p.scope==='tenant'?'租户级':'项目级'}</span></td><td>${esc(p.desc)}</td><td><button class="user-link" onclick="openPolicyDetail('${p.id}','authorizations')">${policyGrantCount(p     function openPolicyDetail(id,tab='basic'){const p=policyBy(id);if(!p||state.role==='项目管理员'&&p.scope!=='project'){state.view='policies';render();return}state.policyDetailId=id;state.policyDetailTab=tab;state.view='policyDetail';render()}
    function renderPolicyDetail(){const p=policyBy(state.policyDetailId);if(!p){state.view='policies';render();return}const canEdit=state.role==='租户管理员'&&p.type==='custom',canGrant=writable(),tabs=[['basic','基本信息'],['content','策略内容'],['authorizations','已授权主体'],['logs','操作记录']];main.innerHTML=`<div class="page-head"><button class="back" onclick="goPolicies()">‹</button><div><h1>${esc(p.name)}</h1><p>权限策略详情 / ${p.type==='custom'?'自定义策略':'系统策略'}</p></div><div class="head-actions">${canGrant?`<button class="btn primary" onclick="openAuthorizationDrawer('${p.id}')">＋ 新增授权</button>`:''}${canEdit?`<button class="btn" onclick="openPolicyCreate('${p.id}')">编辑策略</button><button class="btn danger" onclick="askDeletePolicy('${p.id}')">删除策略</button>`:''}</div></div><section class="detail-card"><div class="profile"><div class="avatar-lg">策</div><div><h2>${esc(p.name)}</h2><p>${p.scope==='tenant'?'租户级':'项目级'}　·　${policyGrantCount(p.id)} 条关联授权　·　${p.statements.length} 条权限语句</p></div></div></section><div class="tabs">${tabs.map(([k,n])=>`<button class="${state.policyDetailTab===k?'active':''}" onclick="setPolicyDetailTab('${k}')">${n}</button>`).join('')}</div><div id="policyDetailContent"></div>`;renderPolicyDetailContent(p)}
    function renderPolicyDetailContent(p){const box=document.getElementById('policyDetailContent');if(state.policyDetailTab==='basic'){box.innerHTML=`<section class="detail-card"><div class="section-head"><h2>策略信息</h2></div><div class="info-grid"><div class="info-item"><span>策略名称</span><b>${esc(p.name)}</b></div><div class="info-item"><span>策略 ID</span><b>${esc(p.id)}</b></div><div class="info-item"><span>策略类型</span><b>${p.type==='custom'?'自定义策略':'系统策略'}</b></div><div class="info-item"><span>适用层级</span><b>${p.scope==='tenant'?'租户级':'项目级'}</b></div><div class="info-item"><span>已关联授权</span><b>${policyGrantCount(p.id)}</b></div><div class="info-item"><span>更新时间</span><b>${p.updatedAt}</b></div><div class="info-item" style="grid-column:span 3"><span>描述</span><b>${esc(p.desc)}</b></div></div>${p.type==='system'?'<div class="notice">ⓘ 系统策略由平台统一维护，不支持编辑或删除。</div>':''}</section>`;return}if(state.policyDetailTab==='content'){box.innerHTML=`<section class="detail-card"><div class="section-head"><h2>权限语句（${p.statements.length}）</h2></div>${p.statements.map((s,i)=>`<div class="permission-scope"><h3>#${i+1}　<span class="state on">允许</span>　${esc(serviceCatalog.find(x=>x.id===s.service)?.name||s.service)}</h3><table class="table" style="min-width:760px"><tbody><tr><td style="width:130px"><b>操作</b></td><td><div class="chips">${s.actions.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div></td></tr><tr><td><b>资源</b></td><td>${s.resourceMode==='all'?'全部资源（*）':esc(s.resources.join('、')||'-')}</td></tr></tbody></table></div>`).join('')}</section>`;return}if(state.policyDetailTab==='authorizations'){const rows=authorizationRows().filter(x=>x.policyId===p.id).filter(x=>state.role!=='项目管理员'||x.scope==='project'&&x.project===state.project);box.innerHTML=`<section class="detail-card"><div class="section-head"><h2>已授权主体（${rows.length}）</h2><div class="actions">${writable()?`<button class="btn primary" onclick="openAuthorizationDrawer('${p.id}')">＋ 新增授权</button>`:''}</div></div><div class="table-wrap"><table class="table" style="min-width:850px"><thead><tr><th>授权主体</th><th>主体类型</th><th>资源范围</th><th>授权时间</th><th>操作</th></tr></thead><tbody>${rows.map(x=>`<tr><td><button class="user-link" onclick="${x.subjectType==='user'?`openDetail(${x.subjectId},'permissions')`:`openGroupDetail('${x.subjectId}','policies')`}">${esc(x.subjectName)}</button></td><td>${x.subjectType==='user'?'用户':'用户组'}</td><td><span class="chip ${x.scope==='tenant'?'tenant':''}">${scopeName(x.scope,x.project)}</span></td><td>${x.grantedAt}</td><td>${writable()?`<button class="link danger" onclick="askRevokeAuthorization('${x.id}')">解除授权</button>`:'-'}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">暂无授权主体</div></td></tr>'}</tbody></table></div></section>`;return}box.innerHTML=`<section class="detail-card"><div class="section-head"><h2>操作记录</h2></div><div class="table-wrap"><table class="table" style="min-width:760px"><thead><tr><th>时间</th><th>操作</th><th>操作人</th><th>结果</th></tr></thead><tbody>${(p.logs||[]).map((x,i)=>`<tr><td>${i?'2026-09-18 11:35':p.updatedAt}</td><td>${esc(x)}</td><td>${p.type==='system'?'system':'lizl'}</td><td><span class="state on">成功</span></td></tr>`).join('')}</tbody></table></div></section>`}
    function setPolicyDetailTab(tab){state.policyDetailTab=tab;renderPolicyDetail()}

    function openPolicyCreate(id=null){if(state.role!=='租户管理员'){toast('仅租户管理员可维护权限策略');return}const p=id?policyBy(id):null;if(p&&p.type!=='custom')return;state.editingPolicyId=id;state.newPolicyName=p?.name||'';state.newPolicyScope=p?.scope||'project';state.newPolicyDescription=p?.desc||'';state.policyStatements=JSON.parse(JSON.stringify(p?.statements||[{effect:'Allow',service:'compute',actions:['compute:View'],resourceMode:'all',resources:[],actionKeyword:''}]));state.view='policyCreate';render()}
    function renderPolicyCreate(){if(state.role!=='租户管理员'){goPolicies();return}const editing=state.editingPolicyId!==null;main.innerHTML=`<div class="page-head"><button class="back" onclick="${editing?`openPolicyDetail('${state.editingPolicyId}')`:'goPolicies()'}">‹</button><div><h1>${editing?'编辑权限策略':'创建权限策略'}</h1><p>通过可视化权限语句定义允许访问的服务、操作和资源。</p></div></div><div class="policy-editor"><div><section class="detail-card"><div class="section-head"><h2>基本信息</h2></div><div class="form" style="max-width:none"><div class="form-row"><label class="required">策略名称</label><div><input class="field" value="${esc(state.newPolicyName)}" oninput="state.newPolicyName=this.value" placeholder="请输入策略名称"><div class="help">2–64 个字符，租户内唯一。</div></div></div><div class="form-row"><label class="required">适用层级</label><select class="field" ${editing?'disabled':''} onchange="state.newPolicyScope=this.value"><option value="tenant" ${state.newPolicyScope==='tenant'?'selected':''}>租户级</option><option value="project" ${state.newPolicyScope==='project'?'selected':''}>项目级</option></select></div><div class="form-row"><label>描述</label><textarea class="field" style="height:82px;padding-top:9px;resize:vertical" maxlength="128" oninput="state.newPolicyDescription=this.value" placeholder="请输入策略用途说明">${esc(state.newPolicyDescription)}</textarea></div></div></section><div class="section-head"><h2>权限语句</h2><div class="actions"><button class="btn" onclick="addPolicyStatement()">＋ 添加语句</button></div></div>${state.policyStatements.map((s,i)=>renderPolicyStatement(s,i)).join('')}<div class="form-actions" style="margin-left:0"><button class="btn primary" onclick="savePolicy()">${editing?'保存修改':'创建权限策略'}</button><button class="btn" onclick="${editing?`openPolicyDetail('${state.editingPolicyId}')`:'goPolicies()'}">取消</button></div></div><aside class="policy-summary"><h3>策略摘要</h3><p class="sub" style="margin-bottom:12px">仅支持允许权限，保存后可直接为用户或用户组授权。</p><div class="summary-code">${esc(policyDraftSummary())}</div><div class="impact" style="grid-template-columns:1fr 1fr"><div><span>权限语句</span><b>${state.policyStatements.length}</b></div><div><span>已选操作</span><b>${state.policyStatements.reduce((n,s)=>n+s.actions.length,0)}</b></div></div></aside></div>`}
    function renderPolicyStatement(s,i){const service=serviceCatalog.find(x=>x.id===s.service)||serviceCatalog[0],keyword=s.actionKeyword||'',actions=service.actions.filter(a=>`${a[0]} ${a[1]}`.toLowerCase().includes(keyword.toLowerCase()));return `<section class="statement-card"><div class="statement-head"><span>#${i+1}　允许</span><div class="actions"><button class="link" onclick="copyPolicyStatement(${i})">复制</button><button class="link danger" ${state.policyStatements.length===1?'disabled':''} onclick="deletePolicyStatement(${i})">删除</button></div></div><div class="statement-body"><div class="form-row"><label class="required">服务</label><select class="field" onchange="setPolicyStatementService(${i},this.value)">${serviceCatalog.map(x=>`<option value="${x.id}" ${x.id===s.service?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="form-row"><label class="required">操作</label><div><input class="field" value="${esc(keyword)}" placeholder="搜索操作名称" onchange="setPolicyActionKeyword(${i},this.value)"><div class="action-grid">${actions.map(a=>`<label class="action-option ${s.actions.includes(a[0])?'checked':''}"><input type="checkbox" ${s.actions.includes(a[0])?'checked':''} onchange="togglePolicyAction(${i},'${a[0]}',this.checked)"><span><b>${esc(a[0])}</b><small class="sub">${esc(a[1])}</small></span></label>`).join('')||'<div class="empty">暂无匹配操作</div>'}</div></div></div><div class="form-row"><label class="required">资源</label><div><div class="radio-row"><label><input type="radio" name="resource-${i}" ${s.resourceMode==='all'?'checked':''} onchange="setPolicyResourceMode(${i},'all')"> 全部资源（*）</label><label><input type="radio" name="resource-${i}" ${s.resourceMode==='specific'?'checked':''} onchange="setPolicyResourceMode(${i},'specific')"> 指定资源</label></div>${s.resourceMode==='specific'?`<input class="field" value="${esc(s.resources.join(';'))}" oninput="setPolicyResources(${i},this.value)" placeholder="输入资源标识，多个资源用分号分隔">`:''}</div></div></div></section>`}
    function policyDraftSummary(){return JSON.stringify({Version:'1',Statement:state.policyStatements.map(s=>({Effect:'Allow',Service:s.service,Action:s.actions,Resource:s.resourceMode==='all'?['*']:s.resources}))},null,2)}
    function addPolicyStatement(){state.policyStatements.push({effect:'Allow',service:'compute',actions:['compute:View'],resourceMode:'all',resources:[],actionKeyword:''});renderPolicyCreate()}
    function copyPolicyStatement(i){state.policyStatements.splice(i+1,0,JSON.parse(JSON.stringify(state.policyStatements[i])));renderPolicyCreate()}
    function deletePolicyStatement(i){if(state.policyStatements.length===1)return;state.policyStatements.splice(i,1);renderPolicyCreate()}
    function setPolicyStatementService(i,value){state.policyStatements[i].service=value;state.policyStatements[i].actions=[serviceCatalog.find(x=>x.id===value).actions[0][0]];state.policyStatements[i].actionKeyword='';renderPolicyCreate()}
    function setPolicyActionKeyword(i,value){state.policyStatements[i].actionKeyword=value;renderPolicyCreate()}
    function togglePolicyAction(i,action,checked){const s=state.policyStatements[i];s.actions=checked?[...new Set([...s.actions,action])]:s.actions.filter(x=>x!==action);renderPolicyCreate()}
    function setPolicyResourceMode(i,value){state.policyStatements[i].resourceMode=value;if(value==='all')state.policyStatements[i].resources=[];renderPolicyCreate()}
    function setPolicyResources(i,value){state.policyStatements[i].resources=value.split(';').map(x=>x.trim()).filter(Boolean)}
    function savePolicy(){const name=state.newPolicyName.trim(),desc=state.newPolicyDescription.trim();if(name.length<2||name.length>64){toast('策略名称需为 2–64 个字符');return}if(policies.some(p=>p.id!==state.editingPolicyId&&p.name.toLowerCase()===name.toLowerCase())){toast('策略名称已存在');return}if(state.policyStatements.some(s=>!s.actions.length)){toast('每条权限语句至少选择一个操作');return}if(state.policyStatements.some(s=>s.resourceMode==='specific'&&!s.resources.length)){toast('指定资源时请输入至少一个资源标识');return}const statements=JSON.parse(JSON.stringify(state.policyStatements.map(({actionKeyword,...s})=>s))),now='2026-09-22 10:18';if(state.editingPolicyId){const p=policyBy(state.editingPolicyId);p.name=name;p.desc=desc||'-';p.statements=statements;p.updatedAt=now;p.logs.unshift('编辑策略内容');state.policyDetailId=p.id;state.policyDetailTab='content';state.view='policyDetail';render();toast('权限策略已保存');return}const id=`CustomPolicy${Date.now()}`;policies.unshift({id,name,scope:state.newPolicyScope,type:'custom',desc:desc||'-',createdAt:now,updatedAt:now,statements,logs:['创建权限策略']});state.policyDetailId=id;state.policyDetailTab='basic';state.view='policyDetail';state.editingPolicyId=null;render();toast('权限策略创建成功，可继续新增授权')}
    function askDeletePolicy(id){const p=policyBy(id),count=policyGrantCount(id);if(!p||p.type!=='custom')return;if(count){toast(`该策略仍关联 ${count} 条授权，请先解除授权`);return}showModal(`<div class="modal-head"><h2>删除权限策略</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body"><p>确认删除自定义策略 <b>${esc(p.name)}</b> 吗？该操作不可恢复。</p><div class="notice">当前策略没有关联授权，删除不会影响用户权限。</div></div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn danger" onclick="confirmDeletePolicy('${id}')">删除策略</button></div>`)}
    function confirmDeletePolicy(id){policies=policies.filter(p=>p.id!==id);closeLayers();goPolicies();toast('权限策略已删除')}

    function renderCreate(){main.innerHTML=`<div class="page-head"><button class="back" onclick="goUsers()">‹</button><div><h1>创建用户</h1><p>创建独立登录账号，加入的组和个人权限在创建完成后配置。</p></div></div><section class="detail-card"><div class="section-head"><h2>基本信息</h2></div><div class="form"><div class="form-row"><label class="required">用户名</label><div><input id="newUsername" class="field" placeholder="请输入用户名"><div class="help">3–32 位字母、数字、下划线或中划线，租户内唯一。</div></div></div><div class="form-row"><label class="required">姓名</label><input id="newName" class="field" placeholder="请输入姓名"></div><div class="form-row"><label>电子邮件</label><input id="newEmail" class="field" placeholder="user@example.com"></div><div class="form-row"><label>手机号码</label><input id="newPhone" class="field" placeholder="请输入手机号码"></div><div class="form-row"><label class="required">密码</label><div><input id="newPassword" class="field" type="password" autocomplete="new-password" placeholder="请输入密码"><div class="help">至少 8 位，并同时包含字母和数字；原型不会保存密码。</div></div></div><div class="form-row"><label class="required">确认密码</label><input id="confirmPassword" class="field" type="password" autocomplete="new-password" placeholder="请再次输入密码"></div><div class="notice">ⓘ 新用户创建后默认无任何权限，可在用户详情中加入用户组或新增个人权限。</div><div class="form-actions"><button class="btn primary" onclick="saveCreate()">创建用户</button><button class="btn" onclick="goUsers()">取消</button></div></div></section>`}
    function renderDetail(){const u=userBy(state.detailId);if(!u||(state.role==='项目管理员'&&!relatedToProject(u))){goUsers();return}const canEdit=writable(),tabs=[['basic','基本信息'],['groups','加入的组'],['permissions','权限管理']];main.innerHTML=`<div class="page-head"><button class="back" onclick="goUsers()">‹</button><div><h1>${esc(u.username)}</h1><p>用户详情 / ${esc(u.name)}</p></div><div class="head-actions">${state.role==='租户管理员'?`<button class="btn" onclick="openEditBasic(${u.id})">编辑基本信息</button><button class="btn ${u.status==='启用'?'danger':''}" onclick="askToggleStatus(${u.id})">${u.status==='启用'?'禁用用户':'启用用户'}</button><button class="btn danger" onclick="askDelete(${u.id})">删除用户</button>`:''}</div></div><section class="detail-card"><div class="profile"><div class="avatar-lg">${esc(u.name).slice(0,1)}</div><div><h2>${esc(u.name)} <span class="state ${u.status==='启用'?'on':'off'}">${u.status}</span></h2><p>${esc(u.email)}　·　U-${String(u.id).padStart(4,'0')}　·　${visibleGroups(u).length} 个用户组</p></div></div></section><div class="tabs">${tabs.map(([k,n])=>`<button class="${state.detailTab===k?'active':''}" onclick="setDetailTab('${k}')">${n}</button>`).join('')}</div><div id="detailContent"></div>`;renderDetailContent(u,canEdit)}
    function renderDetailContent(u,canEdit){const box=document.getElementById('detailContent');if(state.detailTab==='basic'){box.innerHTML=`<section class="detail-card"><div class="section-head"><h2>账号信息</h2></div><div class="info-grid"><div class="info-item"><span>用户名</span><b>${esc(u.username)}</b></div><div class="info-item"><span>姓名</span><b>${esc(u.name)}</b></div><div class="info-item"><span>账号状态</span><b>${u.status}</b></div><div class="info-item"><span>电子邮件</span><b>${esc(u.email||'-')}</b></div><div class="info-item"><span>手机号码</span><b>${esc(u.phone||'-')}</b></div><div class="info-item"><span>用户 ID</span><b>U-${String(u.id).padStart(4,'0')}</b></div><div class="info-item"><span>最近登录</span><b>${u.lastLogin}</b></div><div class="info-item"><span>创建时间</span><b>${u.createdAt}</b></div></div></section>`;return}if(state.detailTab==='groups'){const gs=visibleGroups(u);box.innerHTML=`<section class="detail-card"><div class="section-head"><h2>加入的组（${gs.length}）</h2><div class="actions">${canEdit?'<button class="btn primary" onclick="openGroupDrawer([state.detailId])">＋ 加入用户组</button>':''}</div></div><div class="table-wrap"><table class="table" style="min-width:820px"><thead><tr><th>用户组名称</th><th>作用范围</th><th>备注</th><th>加入时间</th><th>操作</th></tr></thead><tbody>${gs.length?gs.map(g=>`<tr><td><button class="user-link" onclick="openGroupDetail('${g.id}')">${esc(g.name)}</button></td><td><span class="chip ${g.scope==='tenant'?'tenant':''}">${scopeName(g.scope,g.project)}</span></td><td>${esc(g.description||'-')}</td><td>${g.updatedAt}</td><td>${canEdit?`<button class="link danger" onclick="askRemoveGroup(${u.id},'${g.id}')">从用户组移除</button>`:'-'}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">尚未加入任何用户组</div></td></tr>`}</tbody></table></div></section>`;return}renderPermissionManagement(u,canEdit)}
    function renderPermissionManagement(u,canEdit){const box=document.getElementById('detailContent'),grants=visibleGrants(u),inherited=visibleGroups(u).flatMap(g=>g.policies.map(pid=>({group:g,policy:policyBy(pid)})));box.innerHTML=`<section class="detail-card"><div class="section-head"><h2>权限管理</h2></div><div class="tabs" style="gap:24px;margin-bottom:16px"><button class="${state.permissionTab==='personal'?'active':''}" onclick="setPermissionTab('personal')">个人权限</button><button class="${state.permissionTab==='inherited'?'active':''}" onclick="setPermissionTab('inherited')">继承用户组的权限</button></div><div id="permissionContent"></div></section>`;const area=document.getElementById('permissionContent');if(state.permissionTab==='personal'){area.innerHTML=`<div class="section-head"><div class="actions" style="margin-left:0">${canEdit?'<button class="btn primary" onclick="openGrantDrawer(state.detailId)">＋ 新增个人权限</button>':''}</div></div><div class="table-wrap"><table class="table" style="min-width:850px"><thead><tr><th>权限策略</th><th>备注</th><th>资源范围</th><th>授权时间</th><th>操作</th></tr></thead><tbody>${grants.length?grants.map(g=>`<tr><td class="policy-name">${esc(policyBy(g.policyId).name)}</td><td>${esc(policyBy(g.policyId).desc)}</td><td><span class="chip ${g.scope==='tenant'?'tenant':''}">${scopeName(g.scope,g.project)}</span></td><td>${g.grantedAt}</td><td>${canEdit?`<button class="link danger" onclick="askRemoveGrant(${u.id},${u.grants.indexOf(g)})">解除授权</button>`:'-'}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">暂无个人权限</div></td></tr>`}</tbody></table></div>`;return}area.innerHTML=`<div class="notice">ⓘ 以下权限来自用户加入的用户组；如需调整，请修改用户组授权或成员关系。</div><div class="table-wrap"><table class="table" style="min-width:940px"><thead><tr><th>所属组</th><th>权限策略</th><th>备注</th><th>资源范围</th><th>授权时间</th></tr></thead><tbody>${inherited.length?inherited.map(x=>`<tr><td><button class="user-link" onclick="openGroupDetail('${x.group.id}','policies')">${esc(x.group.name)}</button></td><td class="policy-name">${esc(x.policy.name)}</td><td>${esc(x.policy.desc)}</td><td><span class="chip ${x.group.scope==='tenant'?'tenant':''}">${scopeName(x.group.scope,x.group.project)}</span></td><td>${x.group.updatedAt}</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">暂无继承的用户组权限</div></td></tr>`}</tbody></table></div>`}
    function effectiveView(u){const ps=effectivePermissions(u);if(!ps.length)return '<section class="detail-card"><div class="section-head"><h2>有效权限</h2></div><div class="empty">暂无有效权限</div></section>';const names=[...new Set(ps.map(x=>scopeName(x.scope,x.project)))];return `<section class="detail-card"><div class="section-head"><h2>有效权限（${ps.length}）</h2></div><div class="notice">ⓘ 相同作用范围下的同一权限策略已合并，并完整展示所有授权来源。</div>${names.map(name=>{const rows=ps.filter(x=>scopeName(x.scope,x.project)===name);return `<div class="permission-scope"><h3><span class="chip ${name==='租户全局'?'tenant':''}">${esc(name)}</span> ${rows.length} 项权限</h3><table class="table" style="min-width:760px"><thead><tr><th>权限策略</th><th>说明</th><th>权限来源</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="policy-name">${esc(policyBy(x.policyId).name)}</td><td>${esc(policyBy(x.policyId).desc)}</td><td><div class="source-list">${x.sources.map(s=>`<span class="source">${esc(s)}</span>`).join('')}</div></td></tr>`).join('')}</tbody></table></div>`}).join('')}</section>`}
    function openGroupDrawer(ids){state.groupTargetIds=[...ids];state.pendingGroups=[];state.groupKeyword='';renderGroupDrawer();showDrawer()}
    function availableGroups(){return state.role==='项目管理员'?groups.filter(g=>g.scope==='project'&&g.project===state.project):groups}
    function renderGroupDrawer(){const targets=state.groupTargetIds.map(userBy).filter(Boolean),existingIntersection=new Set(availableGroups().filter(g=>targets.every(u=>u.groups.includes(g.id))).map(g=>g.id)),list=availableGroups().filter(g=>`${g.name} ${g.description} ${scopeName(g.scope,g.project)}`.toLowerCase().includes(state.groupKeyword.toLowerCase()));drawer.innerHTML=`<div class="drawer-head"><h2>加入用户组</h2><button class="close" onclick="closeLayers()">×</button></div><div class="drawer-body"><div class="section-head"><h2>已选择用户</h2></div><div class="chips">${targets.map(u=>`<span class="chip">${esc(u.username)}</span>`).join('')}</div><div class="picker"><div class="picker-main"><div class="picker-title">可选用户组</div><div class="picker-search"><input placeholder="搜索用户组名称、范围或说明" value="${esc(state.groupKeyword)}" oninput="state.groupKeyword=this.value;renderGroupDrawer()"></div>${list.map(g=>{const exists=existingIntersection.has(g.id);return `<label class="pick-row ${exists?'disabled':''}"><input type="checkbox" ${state.pendingGroups.includes(g.id)?'checked':''} ${exists?'disabled':''} onchange="togglePendingGroup('${g.id}',this.checked)"><span><b>${esc(g.name)}</b><small class="sub">${esc(g.description)}</small></span><span class="chip ${g.scope==='tenant'?'tenant':''}">${scopeName(g.scope,g.project)}</span></label>`}).join('')}</div><div class="picker-selected"><div class="picker-title">本次选择（${state.pendingGroups.length}）</div>${state.pendingGroups.map(id=>{const g=groupBy(id);return `<div class="selected-item"><span>${esc(g.name)}</span><button onclick="togglePendingGroup('${id}',false)">×</button></div>`}).join('')||'<div class="empty">尚未选择</div>'}</div></div></div><div class="drawer-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn primary" ${state.pendingGroups.length?'':'disabled'} onclick="confirmAddGroups()">确认加入</button></div>`}
    function togglePendingGroup(id,checked){state.pendingGroups=checked?[...new Set([...state.pendingGroups,id])]:state.pendingGroups.filter(x=>x!==id);renderGroupDrawer()}
    function confirmAddGroups(){state.groupTargetIds.forEach(id=>{const u=userBy(id);state.pendingGroups.forEach(gid=>{const g=groupBy(gid);if(!u.groups.includes(gid)){u.groups.push(gid);u.logs.unshift(`加入用户组：${g.name}`);g.logs.unshift(`添加用户：${u.username}`);g.updatedAt='2026-09-21 10:36'}})});closeLayers();state.selected=[];render();toast('已加入所选用户组')}
    function openGroupMemberDrawer(id){const g=groupBy(id);if(!g||!writable()||(state.role==='项目管理员'&&(g.scope!=='project'||g.project!==state.project)))return;state.groupMemberTarget=id;state.groupMemberKeyword='';state.pendingMembers=[];renderGroupMemberDrawer();showDrawer()}
    function renderGroupMemberDrawer(){const g=groupBy(state.groupMemberTarget),members=new Set(groupMembers(g.id).map(u=>u.id)),list=users.filter(u=>`${u.username} ${u.name} ${u.email}`.toLowerCase().includes(state.groupMemberKeyword.toLowerCase()));drawer.innerHTML=`<div class="drawer-head"><h2>添加用户到用户组</h2><button class="close" onclick="closeLayers()">×</button></div><div class="drawer-body"><div class="section-head"><h2>已选择用户组</h2></div><div class="notice"><b>${esc(g.name)}</b>　<span class="chip ${g.scope==='tenant'?'tenant':''}">${scopeName(g.scope,g.project)}</span></div><div class="picker"><div class="picker-main"><div class="picker-title">可选用户</div><div class="picker-search"><input placeholder="搜索用户名、姓名或邮箱" value="${esc(state.groupMemberKeyword)}" oninput="state.groupMemberKeyword=this.value;renderGroupMemberDrawer()"></div>${list.map(u=>{const exists=members.has(u.id);return `<label class="pick-row ${exists?'disabled':''}"><input type="checkbox" ${state.pendingMembers.includes(u.id)?'checked':''} ${exists?'disabled':''} onchange="togglePendingMember(${u.id},this.checked)"><span><b>${esc(u.username)}</b><small class="sub">${esc(u.name)} · ${esc(u.email)}</small></span><span class="state ${u.status==='启用'?'on':'off'}">${u.status}</span></label>`}).join('')||'<div class="empty">暂无匹配用户</div>'}</div><div class="picker-selected"><div class="picker-title">已选择用户（${state.pendingMembers.length}）</div>${state.pendingMembers.map(id=>{const u=userBy(id);return `<div class="selected-item"><span>${esc(u.username)}<small class="sub">${esc(u.name)}</small></span><button onclick="togglePendingMember(${id},false)">×</button></div>`}).join('')||'<div class="empty">尚未选择</div>'}</div></div></div><div class="drawer-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn primary" ${state.pendingMembers.length?'':'disabled'} onclick="confirmAddGroupMembers()">确认添加</button></div>`}
    function togglePendingMember(id,checked){state.pendingMembers=checked?[...new Set([...state.pendingMembers,id])]:state.pendingMembers.filter(x=>x!==id);renderGroupMemberDrawer()}
    function confirmAddGroupMembers(){const g=groupBy(state.groupMemberTarget);state.pendingMembers.forEach(id=>{const u=userBy(id);if(!u.groups.includes(g.id)){u.groups.push(g.id);u.logs.unshift(`加入用户组：${g.name}`);g.logs.unshift(`添加用户：${u.username}`)}});g.updatedAt='2026-09-21 10:36';closeLayers();state.selectedGroups=[];render();toast(`已添加 ${state.pendingMembers.length} 个用户`)}
    function openGroupPolicyDrawer(id){const g=groupBy(id);if(!g||!writable()||(state.role==='项目管理员'&&(g.scope!=='project'||g.project!==state.project)))return;state.groupPolicyTarget=id;state.groupPolicyKeyword='';state.pendingGroupPolicies=[];renderGroupPolicyDrawer();showDrawer()}
    function renderGroupPolicyDrawer(){const g=groupBy(state.groupPolicyTarget),list=policies.filter(p=>p.scope===g.scope&&`${p.name} ${p.desc}`.toLowerCase().includes(state.groupPolicyKeyword.toLowerCase()));drawer.innerHTML=`<div class="drawer-head"><h2>新增用户组授权</h2><button class="close" onclick="closeLayers()">×</button></div><div class="drawer-body"><div class="section-head"><h2>授权主体</h2></div><div class="notice">用户组：<b>${esc(g.name)}</b>　作用范围：<b>${scopeName(g.scope,g.project)}</b></div><div class="picker"><div class="picker-main"><div class="picker-title">可选权限策略</div><div class="picker-search"><input placeholder="搜索权限策略名称或描述" value="${esc(state.groupPolicyKeyword)}" oninput="state.groupPolicyKeyword=this.value;renderGroupPolicyDrawer()"></div>${list.map(p=>{const exists=g.policies.includes(p.id);return `<label class="pick-row ${exists?'disabled':''}"><input type="checkbox" ${state.pendingGroupPolicies.includes(p.id)?'checked':''} ${exists?'disabled':''} onchange="togglePendingGroupPolicy('${p.id}',this.checked)"><span><b>${esc(p.name)}</b><small class="sub">${esc(p.desc)}</small></span><span class="chip ${g.scope==='tenant'?'tenant':''}">${scopeName(g.scope,g.project)}</span></label>`}).join('')||'<div class="empty">暂无可授权策略</div>'}</div><div class="picker-selected"><div class="picker-title">已选择策略（${state.pendingGroupPolicies.length}）</div>${state.pendingGroupPolicies.map(id=>`<div class="selected-item"><span>${esc(policyBy(id).name)}</span><button onclick="togglePendingGroupPolicy('${id}',false)">×</button></div>`).join('')||'<div class="empty">尚未选择</div>'}</div></div></div><div class="drawer-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn primary" ${state.pendingGroupPolicies.length?'':'disabled'} onclick="confirmAddGroupPolicies()">确认授权</button></div>`}
    function togglePendingGroupPolicy(id,checked){state.pendingGroupPolicies=checked?[...new Set([...state.pendingGroupPolicies,id])]:state.pendingGroupPolicies.filter(x=>x!==id);renderGroupPolicyDrawer()}
    function confirmAddGroupPolicies(){const g=groupBy(state.groupPolicyTarget);state.pendingGroupPolicies.forEach(id=>{if(!g.policies.includes(id)){g.policies.push(id);g.logs.unshift(`新增授权：${policyBy(id).name}`)}});g.updatedAt='2026-09-21 10:36';closeLayers();state.selectedGroups=[];render();toast('用户组授权已生效')}
    function activeAdminExistsWithoutGroup(gid){return users.some(u=>u.status==='启用'&&u.groups.some(id=>id!==gid&&isTenantAdminGroup(groupBy(id))))}
    function activeAdminExistsWithoutPolicyGroup(gid){return users.some(u=>u.status==='启用'&&u.groups.some(id=>id!==gid&&isTenantAdminGroup(groupBy(id))))}
    function removingMemberBreaksAdmin(gid,uid){const g=groupBy(gid),u=userBy(uid);return isTenantAdminGroup(g)&&u.status==='启用'&&!u.groups.some(id=>id!==gid&&isTenantAdminGroup(groupBy(id)))&&activeTenantAdmins().length===1}
    function askRemoveGroupMember(gid,uid){const g=groupBy(gid),u=userBy(uid);if(removingMemberBreaksAdmin(gid,uid)){toast('不能移出租户最后一个有效管理员');return}showModal(`<div class="modal-head"><h2>移出用户组</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body"><p>确认将用户 <b>${esc(u.username)}</b> 移出“${esc(g.name)}”吗？</p><div class="notice">保存后将立即重新计算该用户的有效权限。</div></div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn danger" onclick="confirmRemoveGroupMember('${gid}',${uid})">确认移出</button></div>`)}
    function confirmRemoveGroupMember(gid,uid){const g=groupBy(gid),u=userBy(uid);u.groups=u.groups.filter(id=>id!==gid);u.logs.unshift(`移出用户组：${g.name}`);g.logs.unshift(`移出用户：${u.username}`);g.updatedAt='2026-09-21 10:36';closeLayers();render();toast('用户已移出用户组')}
    function askRemoveGroupPolicy(gid,pid){const g=groupBy(gid),p=policyBy(pid);if(pid==='TenantFullAccess'&&isTenantAdminGroup(g)&&!activeAdminExistsWithoutPolicyGroup(gid)){toast('不能移除租户最后一个有效管理员权限');return}showModal(`<div class="modal-head"><h2>移除用户组授权</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body"><p>确认从“${esc(g.name)}”移除策略 <b>${esc(p.name)}</b> 吗？</p><div class="notice">该组 ${groupMembers(gid).length} 名成员的有效权限将立即重新计算。</div></div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn danger" onclick="confirmRemoveGroupPolicy('${gid}','${pid}')">确认移除</button></div>`)}
    function confirmRemoveGroupPolicy(gid,pid){const g=groupBy(gid);g.policies=g.policies.filter(id=>id!==pid);g.logs.unshift(`移除授权：${policyBy(pid).name}`);g.updatedAt='2026-09-21 10:36';closeLayers();render();toast('用户组授权已移除')}
    function askDeleteGroup(id){const g=groupBy(id),members=groupMembers(id);if(isTenantAdminGroup(g)&&!activeAdminExistsWithoutGroup(id)){toast('不能删除承载租户最后一个有效管理员的用户组');return}showModal(`<div class="modal-head"><h2>删除用户组</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body"><p>确认删除用户组 <b>${esc(g.name)}</b> 吗？该操作不可恢复。</p><div class="notice">删除后将解除全部成员关系，并立即重新计算受影响用户的有效权限。</div><div class="impact"><div><span>受影响成员</span><b>${members.length}</b></div><div><span>权限策略</span><b>${g.policies.length}</b></div><div><span>作用范围</span><b style="font-size:14px">${scopeName(g.scope,g.project)}</b></div><div><span>个人权限</span><b>不受影响</b></div></div></div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn danger" onclick="confirmDeleteGroup('${id}')">删除用户组</button></div>`)}
    function confirmDeleteGroup(id){const g=groupBy(id);users.forEach(u=>{if(u.groups.includes(id)){u.groups=u.groups.filter(gid=>gid!==id);u.logs.unshift(`用户组已删除：${g.name}`)}});groups=groups.filter(x=>x.id!==id);closeLayers();goGroups();toast('用户组已删除，成员权限已重新计算')}
    function openGrantDrawer(id){state.grantTargetId=id;state.grantScope=state.role==='项目管理员'?'project':'tenant';state.grantProject=state.project;state.pendingPolicies=[];state.policyKeyword='';renderGrantDrawer();showDrawer()}
    function renderGrantDrawer(){const u=userBy(state.grantTargetId),scopeType=state.role==='项目管理员'?'project':state.grantScope,project=scopeType==='project'?state.grantProject:null,list=policies.filter(p=>p.scope===scopeType&&`${p.name} ${p.desc}`.toLowerCase().includes(state.policyKeyword.toLowerCase()));drawer.innerHTML=`<div class="drawer-head"><h2>新增个人权限</h2><button class="close" onclick="closeLayers()">×</button></div><div class="drawer-body"><div class="section-head"><h2>授权主体</h2></div><div class="notice">用户：<b>${esc(u.username)}</b></div><div class="section-head" style="margin-top:22px"><h2>资源范围</h2></div>${state.role==='项目管理员'?`<div class="notice">当前项目：<b>${esc(state.project)}</b>（固定范围）</div>`:`<div class="toolbar"><select class="filter" onchange="state.grantScope=this.value;state.pendingPolicies=[];renderGrantDrawer()"><option value="tenant" ${scopeType==='tenant'?'selected':''}>租户全局</option><option value="project" ${scopeType==='project'?'selected':''}>具体项目</option></select>${scopeType==='project'?`<select class="filter" onchange="state.grantProject=this.value;state.pendingPolicies=[];renderGrantDrawer()">${projects.map(p=>`<option ${p===project?'selected':''}>${p}</option>`).join('')}</select>`:''}</div>`}<div class="picker"><div class="picker-main"><div class="picker-title">权限策略</div><div class="picker-search"><input placeholder="搜索权限策略" value="${esc(state.policyKeyword)}" oninput="state.policyKeyword=this.value;renderGrantDrawer()"></div>${list.map(p=>{const exists=u.grants.some(x=>x.policyId===p.id&&x.scope===scopeType&&(scopeType==='tenant'||x.project===project));return `<label class="pick-row ${exists?'disabled':''}"><input type="checkbox" ${state.pendingPolicies.includes(p.id)?'checked':''} ${exists?'disabled':''} onchange="togglePendingPolicy('${p.id}',this.checked)"><span><b>${esc(p.name)}</b><small class="sub">${esc(p.desc)}</small></span><span class="chip ${scopeType==='tenant'?'tenant':''}">${scopeName(scopeType,project)}</span></label>`}).join('')}</div><div class="picker-selected"><div class="picker-title">已选择策略（${state.pendingPolicies.length}）</div>${state.pendingPolicies.map(id=>`<div class="selected-item"><span>${esc(policyBy(id).name)}</span><button onclick="togglePendingPolicy('${id}',false)">×</button></div>`).join('')||'<div class="empty">尚未选择</div>'}</div></div></div><div class="drawer-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn primary" ${state.pendingPolicies.length?'':'disabled'} onclick="confirmAddGrants()">确认授权</button></div>`}
    function togglePendingPolicy(id,checked){state.pendingPolicies=checked?[...new Set([...state.pendingPolicies,id])]:state.pendingPolicies.filter(x=>x!==id);renderGrantDrawer()}
    function confirmAddGrants(){const u=userBy(state.grantTargetId),scopeType=state.role==='项目管理员'?'project':state.grantScope,project=scopeType==='project'?state.grantProject:null;state.pendingPolicies.forEach(id=>{u.grants.push({policyId:id,scope:scopeType,project,grantedAt:'2026-09-21 10:36'});u.logs.unshift(`新增个人权限：${policyBy(id).name}`)});closeLayers();render();toast('个人权限已生效')}
    function openProjectMemberDrawer(){state.memberCandidates=[];state.memberGroup=availableGroups()[0]?.id||'';renderMemberDrawer();showDrawer()}
    function renderMemberDrawer(){const candidates=users.filter(u=>!relatedToProject(u)&&u.status==='启用'),gs=groups.filter(g=>g.scope==='project'&&g.project===state.project);drawer.innerHTML=`<div class="drawer-head"><h2>添加项目成员</h2><button class="close" onclick="closeLayers()">×</button></div><div class="drawer-body"><div class="notice">从租户已有用户中选择成员，并加入 ${esc(state.project)} 的一个用户组。项目管理员不能创建或删除租户用户。</div><div class="section-head" style="margin-top:20px"><h2>选择用户</h2></div><div class="table-wrap"><table class="table" style="min-width:620px"><thead><tr><th class="check"></th><th>用户名 / 姓名</th><th>电子邮件</th><th>状态</th></tr></thead><tbody>${candidates.map(u=>`<tr><td><input type="checkbox" ${state.memberCandidates.includes(u.id)?'checked':''} onchange="toggleMemberCandidate(${u.id},this.checked)"></td><td>${esc(u.username)}<span class="sub">${esc(u.name)}</span></td><td>${esc(u.email)}</td><td><span class="state on">启用</span></td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">暂无可添加用户</div></td></tr>'}</tbody></table></div><div class="form-row"><label class="required">加入用户组</label><select class="field" onchange="state.memberGroup=this.value">${gs.map(g=>`<option value="${g.id}" ${g.id===state.memberGroup?'selected':''}>${esc(g.name)}</option>`).join('')}</select></div></div><div class="drawer-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn primary" ${state.memberCandidates.length&&state.memberGroup?'':'disabled'} onclick="confirmAddMembers()">确认添加</button></div>`}
    function toggleMemberCandidate(id,checked){state.memberCandidates=checked?[...state.memberCandidates,id]:state.memberCandidates.filter(x=>x!==id);renderMemberDrawer()}
    function confirmAddMembers(){state.memberCandidates.forEach(id=>{const u=userBy(id);if(!u.groups.includes(state.memberGroup)){u.groups.push(state.memberGroup);u.logs.unshift(`加入用户组：${groupBy(state.memberGroup).name}`)}});closeLayers();renderUsers();toast('项目成员已添加')}
    function showDrawer(){overlay.classList.add('show');drawer.classList.add('show')}
    function closeLayers(){overlay.classList.remove('show');drawer.classList.remove('show');modal.classList.remove('show');drawer.innerHTML='';modal.innerHTML=''}
    function showModal(html){modal.innerHTML=html;overlay.classList.add('show');modal.classList.add('show')}
    function askToggleStatus(id){const u=userBy(id),disable=u.status==='启用';if(disable&&isActiveTenantAdmin(u)&&activeTenantAdmins().length===1){toast('不能禁用租户最后一个有效管理员');return}showModal(`<div class="modal-head"><h2>${disable?'禁用':'启用'}用户</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body"><p>确认${disable?'禁用':'启用'}用户 <b>${esc(u.username)}</b> 吗？</p>${disable?impactView(u):'<div class="notice">启用后用户可按现有有效权限访问平台。</div>'}</div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn ${disable?'danger':'primary'}" onclick="confirmToggleStatus(${id})">确认${disable?'禁用':'启用'}</button></div>`)}
    function impactView(u){return `<div class="notice">禁用后该用户的后续请求立即失效，运行中任务不自动终止。</div><div class="impact"><div><span>加入的用户组</span><b>${u.groups.length}</b></div><div><span>个人权限</span><b>${u.grants.length}</b></div><div><span>拥有资源</span><b>${u.resources}</b></div><div><span>运行中任务</span><b>${u.tasks}</b></div></div>`}
    function confirmToggleStatus(id){const u=userBy(id);u.status=u.status==='启用'?'停用':'启用';u.logs.unshift(`用户已${u.status}`);closeLayers();render();toast(`用户已${u.status}`)}
    function askDelete(id){const u=userBy(id);if(isActiveTenantAdmin(u)&&activeTenantAdmins().length===1){toast('不能删除租户最后一个有效管理员');return}showModal(`<div class="modal-head"><h2>删除用户</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body"><p>确认删除用户 <b>${esc(u.username)}</b> 吗？该操作不可恢复。</p>${impactView(u)}</div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn danger" onclick="confirmDelete(${id})">删除用户</button></div>`)}
    function confirmDelete(id){users=users.filter(u=>u.id!==id);closeLayers();goUsers();toast('用户已删除')}
    function askRemoveGroup(uid,gid){const u=userBy(uid),g=groupBy(gid);if(removingMemberBreaksAdmin(gid,uid)){toast('不能移出租户最后一个有效管理员');return}showModal(`<div class="modal-head"><h2>移出用户组</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body"><p>确认将 <b>${esc(u.username)}</b> 移出“${esc(g.name)}”吗？</p><div class="notice">保存后将立即重新计算有效权限。</div></div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn danger" onclick="confirmRemoveGroup(${uid},'${gid}')">确认移出</button></div>`)}
    function confirmRemoveGroup(uid,gid){const u=userBy(uid),g=groupBy(gid);u.groups=u.groups.filter(x=>x!==gid);u.logs.unshift(`移出用户组：${g.name}`);g.logs.unshift(`移出用户：${u.username}`);g.updatedAt='2026-09-21 10:36';closeLayers();render();toast('已移出用户组')}
    function askRemoveGrant(uid,index){const u=userBy(uid),g=u.grants[index];showModal(`<div class="modal-head"><h2>移除个人权限</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body"><p>确认移除“${esc(policyBy(g.policyId).name)}”吗？</p><div class="notice">资源范围：${scopeName(g.scope,g.project)}。移除后用户权限立即更新。</div></div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn danger" onclick="confirmRemoveGrant(${uid},${index})">确认移除</button></div>`)}
    function confirmRemoveGrant(uid,index){const u=userBy(uid),g=u.grants[index];u.grants.splice(index,1);u.logs.unshift(`移除个人权限：${policyBy(g.policyId).name}`);closeLayers();render();toast('个人权限已移除')}
    function askBulkDisable(){const chosen=users.filter(u=>state.selected.includes(u.id)&&u.status==='启用'),remaining=activeTenantAdmins().filter(u=>!state.selected.includes(u.id));if(chosen.some(isActiveTenantAdmin)&&!remaining.length){toast('批量操作会导致租户无有效管理员');return}showModal(`<div class="modal-head"><h2>批量禁用用户</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body"><p>确认禁用所选 ${chosen.length} 个启用状态的用户吗？</p><div class="notice">用户后续请求将立即失效，运行中任务不自动终止。</div></div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn danger" onclick="confirmBulkDisable()">确认禁用</button></div>`)}
    function confirmBulkDisable(){users.filter(u=>state.selected.includes(u.id)).forEach(u=>{u.status='停用';u.logs.unshift('用户已停用')});state.selected=[];closeLayers();renderUsers();toast('批量禁用完成')}
    function openEditBasic(id){const u=userBy(id);showModal(`<div class="modal-head"><h2>编辑基本信息</h2><button class="close" onclick="closeLayers()">×</button></div><div class="modal-body"><div class="form-row"><label>用户名</label><input class="field" value="${esc(u.username)}" disabled></div><div class="form-row"><label class="required">姓名</label><input id="editName" class="field" value="${esc(u.name)}"></div><div class="form-row"><label>电子邮件</label><input id="editEmail" class="field" value="${esc(u.email)}"></div><div class="form-row"><label>手机号码</label><input id="editPhone" class="field" value="${esc(u.phone)}"></div></div><div class="modal-foot"><button class="btn" onclick="closeLayers()">取消</button><button class="btn primary" onclick="saveBasic(${id})">保存</button></div>`)}
    function saveBasic(id){const u=userBy(id),name=document.getElementById('editName').value.trim();if(!name){toast('请输入姓名');return}u.name=name;u.email=document.getElementById('editEmail').value.trim();u.phone=document.getElementById('editPhone').value.trim();u.logs.unshift('编辑基本信息');closeLayers();renderDetail();toast('基本信息已保存')}
    function saveCreate(){const username=document.getElementById('newUsername').value.trim(),name=document.getElementById('newName').value.trim(),email=document.getElementById('newEmail').value.trim(),phone=document.getElementById('newPhone').value.trim(),password=document.getElementById('newPassword').value,confirm=document.getElementById('confirmPassword').value;if(!/^[A-Za-z0-9_-]{3,32}$/.test(username)){toast('用户名需为 3–32 位字母、数字、下划线或中划线');return}if(users.some(u=>u.username.toLowerCase()===username.toLowerCase())){toast('用户名已存在');return}if(!name){toast('请输入姓名');return}if(password.length<8||!/[A-Za-z]/.test(password)||!/\d/.test(password)){toast('密码至少 8 位，并同时包含字母和数字');return}if(password!==confirm){toast('两次输入的密码不一致');return}const id=Math.max(...users.map(u=>u.id))+1;users.unshift({id,username,name,email:email||'-',phone:phone||'-',status:'启用',groups:[],grants:[],lastLogin:'从未登录',createdAt:'2026-09-21 10:36',resources:0,tasks:0,logs:['创建用户']});state.detailId=id;state.detailTab='basic';showModal(`<div class="modal-head"><h2>用户创建成功</h2></div><div class="modal-body"><div class="notice">用户 <b>${esc(username)}</b> 已创建，当前尚未加入用户组，也没有个人权限。</div><p>密码仅用于本次创建，原型未保存密码内容。</p></div><div class="modal-foot"><button class="btn" onclick="closeLayers();goUsers()">返回列表</button><button class="btn primary" onclick="closeLayers();openDetail(${id},'groups')">配置权限</button></div>`)}
    function openCreate(){state.view='create';render()}
    function openDetail(id,tab='basic'){state.detailId=id;state.detailTab=tab;if(tab==='permissions')state.permissionTab='personal';state.view='detail';render()}
    function setDetailTab(tab){state.detailTab=tab;if(tab==='permissions')state.permissionTab='personal';renderDetail()}
    function setPermissionTab(tab){state.permissionTab=tab;renderDetail()}
    function goUsers(){state.view='users';state.detailId=null;state.selected=[];render()}
    function toggleSelected(id,checked){state.selected=checked?[...new Set([...state.selected,id])]:state.selected.filter(x=>x!==id);renderUsers()}
    function toggleAll(checked){const ids=filteredUsers().map(u=>u.id);state.selected=checked?[...new Set([...state.selected,...ids])]:state.selected.filter(id=>!ids.includes(id));renderUsers()}
    roleSelect.addEventListener('change',e=>{state.role=e.target.value;state.view='users';state.detailId=null;state.groupDetailId=null;state.policyDetailId=null;state.selected=[];state.selectedGroups=[];state.selectedAuthorizations=[];state.keyword='';state.status='全部状态';state.group='全部用户组';state.scopeFilter='全部范围';state.source='全部来源';state.groupListKeyword='';state.groupScope='全部范围';state.groupProject='全部项目';state.authorizationKeyword='';state.authorizationSubjectType='全部主体';state.authorizationPolicyType='全部策略';state.authorizationScope='全部范围';state.authorizationProject='全部项目';state.policyListKeyword='';state.policyListType='全部策略';state.policyListScope='全部层级';closeLayers();render();toast(`已切换为${state.role}视角`)});
    document.querySelectorAll('.nav-item[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;state.detailId=null;state.groupDetailId=null;state.policyDetailId=null;state.selected=[];state.selectedGroups=[];state.selectedAuthorizations=[];render()}));overlay.addEventListener('click',closeLayers);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayers()});render();
  </script>
</body>
</html>
